[project]
name = "xcore-doctype"
version = "0.1.0"
description = "Moteur de DocTypes et interface Desk pour xcore : définissez un document une fois (YAML/JSON), obtenez stockage, API, permissions, hooks et UI Vue."
authors = [
    {name = "traoreera"},
    {email = "traoreera@gmail.com"}
]


license = "MIT"
requires-python = ">=3.14,<4.0"
dependencies = [
    # [sqlite] apporte SQLAlchemy asyncio + aiosqlite (développement)
    "xcoreruntime[sqlite] (>=2.9.1,<3.0.0)",
    "xcdk (>=0.2.0,<0.3.0)",
    "xcorecli (>=2.3.0,<3.0.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    # Téléversement de fichiers (champs Image et Attach) : FastAPI exige python-multipart pour lire un formulaire multipart
    "python-multipart (>=0.0.20,<1.0.0)",
    "redis[asyncio] (>=8.1.0,<9.0.0)"
]

[project.scripts]
xcore-doctype = "xcore_doctype.cli:main"

# D1 : le plugin se déclare au groupe `xcore.plugins`. INERTE tant qu'xcore ne lit pas ce groupe (il ne découvre que des
# dossiers) : la valeur est une fonction qui rend le dossier du plugin, `xcore-doctype install` en pose une copie (process/phase4.md).
[project.entry-points."xcore.plugins"]
xcore-doctype = "xcore_doctype:plugin_dir"

[project.optional-dependencies]
# L'extra [postgres] d'xcore apporte psycopg2 (synchrone) : il faut asyncpg pour l'accès async (D11)
postgres = ["asyncpg (>=0.31.0,<1.0.0)"]
# Impression PDF (process/impression.md §1). OPTIONNEL par décision : sans l'extra, l'aperçu HTML fonctionne et
# seule la route PDF répond `503 pdf_engine_missing` en nommant le paquet. C'est ce qui rend l'engagement
# réversible — rien d'autre dans le moteur ne dépend de PlutoPrint.
#   plutoprint : MIT, wheels précompilés (cp314 manylinux), moteur embarqué, ~20,5 Mo, aucun binaire système.
#     Épinglé au MINEUR parce qu'il est en 0.x : chaque 0.x+1 doit être re-mesuré (le `@page` suivi, l'URL
#     `data:` qui échappe au récupérateur de ressources, l'en-tête de tableau répété), pas adopté à l'aveugle.
#   pypdf : BSD-3, Python pur, 409 Ko. Ne sert QU'au fond PDF d'un papier à en-tête (§5) ; son absence
#     n'empêche pas les autres gabarits d'imprimer, le code sonde les deux paquets séparément.
pdf = ["plutoprint (>=0.23.0,<0.24.0)", "pypdf (>=6.21.3,<7.0.0)"]

[tool.poetry]
packages = [{include = "xcore_doctype", from = "src"}]
# Le Desk construit (`pnpm build` dans ui/) est ignoré par .gitignore (dist/) mais doit partir dans le wheel. Les shims `plugin_dir/src/main.py` et `system_plugin_dir/src/main.py` aussi : le motif
# `main.py` de .gitignore (pensé pour le `main.py` de la racine, l'hôte de développement) le retire sinon du wheel, et `xcore-doctype install` n'aurait plus rien à poser.
include = [
    { path = "src/xcore_doctype/ui/dist", format = ["sdist", "wheel"] },
    { path = "src/xcore_doctype/plugin_dir/src/main.py", format = ["sdist", "wheel"] },
    { path = "src/xcore_doctype/system_plugin_dir/src/main.py", format = ["sdist", "wheel"] },
]

[dependency-groups]
dev = [
    "mkdocs (>=1.6.1,<2.0.0)",
    "pytest (>=9.0.0,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "asyncpg (>=0.31.0,<1.0.0)"
]
host = [
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "passlib[argon2] (>=1.7.4,<2.0.0)",
    "pyotp (>=2.10.0,<3.0.0)",
    "qrcode (>=8.2,<9.0)",
    "aiosmtplib (>=5.1.3,<6.0.0)"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "postgres: nécessite XCORE_DOCTYPE_TEST_PG_URL (postgresql+asyncpg://...)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
