# L'espace « RH » : l'effectif d'abord (chiffres et graphiques), puis les accès.
schema_version: 1
name: hr
label: RH
icon: users
description: Employés, services et congés.
order: 30
blocks:
  - { type: header, text: Effectif }
  - { type: number_card, label: Employés actifs, doctype: Employee, filters: { status: Actif }, color: green }
  - { type: number_card, label: En congé, doctype: Employee, filters: { status: En congé }, color: orange }
  - { type: number_card, label: Services, doctype: Department, color: blue }
  - { type: number_card, label: Congés à valider, doctype: Leave Request, filters: { docstatus: 0 }, color: purple }
  - { type: chart, label: Embauches par mois, doctype: Employee, kind: bar, group_by: hire_date, bucket: month, periods: 12, cols: 8 }
  - { type: chart, label: Par statut, doctype: Employee, kind: donut, group_by: status, cols: 4 }
  - { type: chart, label: Effectif par service, doctype: Employee, kind: bar, group_by: department, limit: 8, cols: 6 }
  - { type: chart, label: Congés par type, doctype: Leave Request, kind: donut, group_by: leave_type, cols: 6 }
  - { type: quick_list, label: Derniers employés, doctype: Employee, limit: 5, cols: 6 }
  - { type: quick_list, label: Congés à valider, doctype: Leave Request, filters: { docstatus: 0 }, limit: 5, cols: 6 }
  - { type: header, text: Accès }
  - { type: shortcut, doctype: Employee, new: true }
  - { type: shortcut, doctype: Department, new: true }
  - { type: shortcut, doctype: Leave Request, new: true }
