# L'espace « Ventes » : un tableau de bord d'abord, les accès ensuite.
schema_version: 1
name: sales
label: Ventes
icon: shopping-cart
description: Clients, factures numérotées et pays.
order: 10
blocks:
  - { type: header, text: Vue d'ensemble }
  - { type: number_card, label: Factures, doctype: Invoice, color: blue }
  - { type: number_card, label: Chiffre d'affaires, doctype: Invoice, function: sum, field: total, color: green }
  - { type: number_card, label: Facture moyenne, doctype: Invoice, function: avg, field: total, color: purple }
  - { type: number_card, label: Clients, doctype: Customer, color: teal }
  - { type: chart, label: Facturé par mois, doctype: Invoice, kind: line, group_by: posting_date, bucket: month, periods: 12, function: sum, field: total, cols: 8 }
  - { type: chart, label: Clients par type, doctype: Customer, kind: donut, group_by: type, cols: 4 }
  - { type: chart, label: Chiffre d'affaires par client, doctype: Invoice, kind: bar, group_by: customer, function: sum, field: total, limit: 8, cols: 6 }
  - { type: chart, label: Clients par pays, doctype: Customer, kind: donut, group_by: country, cols: 6 }
  - { type: quick_list, label: Dernières factures, doctype: Invoice, limit: 5, cols: 12 }
  - { type: header, text: Facturation }
  - { type: shortcut, doctype: Invoice, new: true }
  - { type: header, text: Clients }
  - { type: shortcut, doctype: Customer, new: true }
  - { type: shortcut, doctype: Country, new: true }
