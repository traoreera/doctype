# Le solde d'un article dans un entrepôt : MAINTENU à chaque écriture du journal (jamais recalculé à la lecture), vérifiable par
# `stock.ledger.verify_balances`. Fermé à tout écrivain humain, comme le journal. Nom : « <article>@<entrepôt> ».
schema_version: 1
name: Bin
label: Solde
module: stock
icon: box
track_changes: false
fields:
  - { fieldname: item, label: Article, fieldtype: Link, options: Item, required: true, in_list_view: true }
  - { fieldname: warehouse, label: Entrepôt, fieldtype: Link, options: Warehouse, required: true, in_list_view: true }
  - { fieldname: qty, label: Quantité, fieldtype: Decimal, decimals: 3, required: true, in_list_view: true, unit_from: item.uom }
  - { fieldname: last_posting_date, label: Dernier mouvement, fieldtype: Date, in_list_view: true }
permissions:
  write: []
  create: []
  delete: []
