# Le seul document qu'une personne saisit en stock : une réception, une sortie ou un transfert. SOUMETTRE le fait entrer dans le
# journal (hook `stock.post_entry`, dans la même transaction) ; l'ANNULER écrit le mouvement inverse (`stock.reverse_entry`).
# Rien n'est jamais modifié ni supprimé dans le journal : une correction passe par annuler, puis amender.
schema_version: 1
name: Stock Entry
label: Mouvement de stock
module: stock
icon: arrow-right-arrow-left
submittable: true
naming: { series: "MS-{YYYY}-{#####}" }
fields:
  - { fieldname: purpose, label: Nature, fieldtype: Select, options: [Réception, Sortie, Transfert], required: true, in_list_view: true }
  - { fieldname: posting_date, label: Date du mouvement, fieldtype: Date, default: today, required: true, in_list_view: true, description: "Ni dans le futur, ni avant le dernier mouvement déjà passé sur le même article et entrepôt (pas d'antidatage)" }
  - { fieldname: items, label: Lignes, fieldtype: Table, options: Stock Entry Line, required: true }
  - { fieldname: remarks, label: Remarques, fieldtype: Text }
layout:
  - section: Mouvement
    columns: [[purpose], [posting_date]]
  - section: Lignes
    columns: [[items]]
  - columns: [[remarks]]
hooks:
  validate: [stock.check_entry]
  on_submit: [stock.post_entry]
  on_cancel: [stock.reverse_entry]
# Grants par convention : stock:stock_entry:read | write | delete | submit | cancel.
