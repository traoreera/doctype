# L'espace « Stock » : ce qu'on voit en ouvrant le module. D'abord un tableau de bord (chiffres, graphiques, derniers mouvements), calculé avec les
# droits de celui qui regarde ; un bloc sur un type qu'il ne peut pas lire disparaît. Puis les accès.
schema_version: 1
name: stock
label: Stock
icon: warehouse
description: Réceptions, sorties et transferts ; soldes et journal par article et entrepôt (quantités, sans valorisation).
order: 20
blocks:
  - { type: header, text: Vue d'ensemble }
  - { type: number_card, label: Mouvements à soumettre, doctype: Stock Entry, filters: { docstatus: 0 }, color: orange }
  - { type: number_card, label: Mouvements soumis, doctype: Stock Entry, filters: { docstatus: 1 }, color: green }
  - { type: number_card, label: Articles, doctype: Item, color: blue }
  - { type: number_card, label: Entrepôts, doctype: Warehouse, color: teal }
  - { type: chart, label: Mouvements soumis par mois, doctype: Stock Entry, kind: bar, group_by: posting_date, bucket: month, periods: 6, filters: { docstatus: 1 }, cols: 8 }
  - { type: chart, label: Par nature, doctype: Stock Entry, kind: donut, group_by: purpose, filters: { docstatus: 1 }, cols: 4 }
  - { type: chart, label: Stock par article, doctype: Bin, kind: bar, group_by: item, function: sum, field: qty, limit: 8, cols: 6 }
  - { type: chart, label: Articles suivis par entrepôt, doctype: Bin, kind: donut, group_by: warehouse, cols: 6 }
  - { type: quick_list, label: Derniers mouvements, doctype: Stock Entry, limit: 5, cols: 12 }
  - { type: header, text: Opérations }
  - { type: shortcut, doctype: Stock Entry, new: true }
  - { type: shortcut, doctype: Bin }
  - { type: shortcut, doctype: Stock Ledger Entry }
  - { type: header, text: Référentiel }
  - { type: shortcut, doctype: Item, new: true }
  - { type: shortcut, doctype: Warehouse, new: true }
