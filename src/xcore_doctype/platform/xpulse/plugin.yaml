name: xpulse
version: 0.1.0
author: xcore team's
description: >
  XPulse est un systeme de notification realtime

execution_mode: trusted
entry_point: src/main.py

# auth AVANT (les grants s'annoncent par rbac.declare). Sans contrainte de version : xauth et l'auth de test des dépôts n'ont pas
# la même numérotation, et c'est le contrat (le jeton, rbac.declare) qui compte, pas un numéro.
requires: [auth]

# Les modules publient leurs messages par IPC (`xpulse.publish`, `xpulse.broadcast`) : tout plugin de confiance peut l'appeler (il
# vit déjà dans le processus). Un opérateur qui veut restreindre nomme ici les plugins permis. Sans cette ligne, xcore répond
# `ipc_denied` à TOUS les appels de plugin (mesuré).
allowed_callers: ["*"]

# ── Imports autorisés ────────────────────────────────────────────────────────
allowed_imports:
  - fastapi
  - asyncio
  - dataclasses
  - json
  - logging
  - re
  - typing

permissions:
  - resource: "xpulse.publish"
    actions: ["*"]
    effect: "allow"
  - resource: "xpulse.broadcast"
    actions: ["*"]
    effect: "allow"
  - resource: "xpulse.email"
    actions: ["*"]
    effect: "allow"

resources:
  timeout_seconds: 10
  max_memory_mb: 100
  max_disk_mb: 1
  rate_limit:
    calls: 100
    period_seconds: 60

runtime:
  health_check:
    enabled: true
    interval_seconds: 60
    timeout_seconds: 3

  retry:
    max_attempts: 3
    backoff_seconds: 3.0

envconfiguration:
  inject: false
  env_file: .env

env: {}

rbac:
  grants:
    - name: xpulse:admin:publish
      description: "Envoi d'une notification a tout les utilisateurs"
      tenant_grantable: false
      group: "notification"

    - name: xpulse:tenant:publish
      description: "Envoi d'une notification a tout les utilisateurs"
      tenant_grantable: true
      group: "notification"

    - name: xpulse:admin:broadcast
      description: "Envoi d'une notification a tout les utilisateurs"
      tenant_grantable: false
      group: "notification"

    - name: xpulse:tenant:broadcast
      description: "Envoi d'une notification a tout les utilisateurs"
      tenant_grantable: true
      group: "notification"
