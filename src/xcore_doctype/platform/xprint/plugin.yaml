# xprint : les gabarits d'impression des pièces commerciales de l'ERP (devis, commande, facture, livraison, commande
# fournisseur, reçu de paiement). Que du YAML (print/<DocType>/*.yaml) et quelques lignes de Python pour les charger.
#
# Chaque gabarit vise un DocType d'un AUTRE plugin (selling, accounts, stock, buying) : il n'est chargé que si ce type est
# présent, un module absent n'est pas une faute. Une organisation peut ensuite refaire chaque gabarit à l'écran
# (« Personnaliser l'impression ») : le sien passe avant celui-ci, et son papier à en-tête (fond PDF des Paramètres) se pose dessous.
name: xprint
version: 0.1.0
author: xcore team's
description: "Gabarits d'impression des pièces commerciales (YAML seul)."
framework_version: ">=2.9"
execution_mode: trusted
entry_point: src/main.py
# xcore-doctype d'abord : il fournit le service doctype_registry. Les modules dont on imprime les pièces doivent être chargés AVANT
# xprint ; avec le jeu `doctypes/` chargé par le moteur (doctype.doctypes_dirs), c'est le cas. Avec un plugin par module, ajoutez-les
# ici (requires: [xcore-doctype, selling, accounts, stock, buying]).
requires: [xcore-doctype]
