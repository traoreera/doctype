# Le BON DE LIVRAISON : des quantités, pas de prix (il voyage avec la marchandise), et la place pour la signature du destinataire.
schema_version: 1
doctype: Delivery Note
name: standard
label: Bon de livraison
page: { size: A4, orientation: portrait, top: 18, bottom: 18, left: 15, right: 15 }
content: >-
  <table data-style="plain"><tbody><tr>
  <td style="width:55%"><h1>BON DE LIVRAISON</h1><p>N° <strong><span data-value="name">N°</span></strong></p></td>
  <td style="text-align:right"><p><strong><span data-value="doc.company">Société</span></strong></p></td>
  </tr></tbody></table>
  <table data-style="boxed"><tbody>
  <tr><th>Livré à</th><th>Transport</th></tr>
  <tr><td><p><strong><span data-value="doc.customer_name">Client</span></strong></p>
  <p><span data-value="doc.shipping_address_name">Adresse de livraison</span></p>
  <p>Date : <span data-value="doc.posting_date">Date</span></p></td>
  <td><p>Transporteur : <span data-value="doc.transporter_name">Transporteur</span></p>
  <p>Véhicule : <span data-value="doc.vehicle_no">Véhicule</span></p>
  <p>Chauffeur : <span data-value="doc.driver_name">Chauffeur</span></p></td></tr>
  </tbody></table>
  <p></p>
  <div data-block='{"type":"table","field":"items","style":"bordered","columns":[{"field":"item_code","label":"Réf.","width":18},{"field":"item_name","label":"Désignation","width":50},{"field":"qty","label":"Qté","align":"right","width":16},{"field":"uom","label":"Unité","width":16}]}'></div>
  <p>Quantité totale : <strong><span data-value="doc.total_qty">Quantité totale</span></strong></p>
  <table data-style="boxed"><tbody>
  <tr><th>Visa de l'expéditeur</th><th>Reçu en bon état (date, nom, signature)</th></tr>
  <tr><td><p>&#160;</p><p>&#160;</p><p>&#160;</p><p>&#160;</p></td><td><p>&#160;</p><p>&#160;</p><p>&#160;</p><p>&#160;</p></td></tr>
  </tbody></table>
