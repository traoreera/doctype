# Le REÇU (ou l'avis) de PAIEMENT : qui a payé quoi, comment, et sur quelles pièces le montant est imputé.
schema_version: 1
doctype: Payment Entry
name: standard
label: Reçu de paiement
page: { size: A5, orientation: landscape, top: 12, bottom: 12, left: 12, right: 12 }
content: >-
  <table data-style="plain"><tbody><tr>
  <td style="width:55%"><h1>REÇU DE PAIEMENT</h1><p>N° <strong><span data-value="name">N°</span></strong></p></td>
  <td style="text-align:right"><p><strong><span data-value="doc.company">Société</span></strong></p><p>Date : <span data-value="doc.posting_date">Date</span></p></td>
  </tr></tbody></table>
  <table data-style="boxed"><tbody>
  <tr><th colspan="2">Paiement</th></tr>
  <tr><td>Reçu de</td><td><strong><span data-value="doc.party_name">Tiers</span></strong></td></tr>
  <tr><td>Montant</td><td><strong><span data-value="doc.paid_amount">Montant</span></strong></td></tr>
  <tr><td>En lettres</td><td><span data-value="doc.in_words">Montant en lettres</span></td></tr>
  <tr><td>Mode de paiement</td><td><span data-value="doc.mode_of_payment">Mode de paiement</span></td></tr>
  <tr><td>Référence</td><td><span data-value="doc.reference_no">Référence</span> du <span data-value="doc.reference_date">Date</span></td></tr>
  </tbody></table>
  <p></p>
  <div data-block='{"type":"table","field":"references","label":"Imputation","style":"ruled","density":"compact","columns":[{"field":"reference_doctype","label":"Pièce","width":25},{"field":"reference_name","label":"N°","width":25},{"field":"total_amount","label":"Montant","align":"right","width":25},{"field":"allocated_amount","label":"Imputé","align":"right","width":25}]}'></div>
  <p style="text-align:right">Signature et cachet</p>
