# La CONFIRMATION DE COMMANDE client : ce qui a été commandé et pour quand.
schema_version: 1
doctype: Sales Order
name: standard
label: Confirmation de commande
page: { size: A4, orientation: portrait, top: 18, bottom: 18, left: 15, right: 15 }
content: >-
  <table data-style="plain"><tbody><tr>
  <td style="width:55%"><h1>CONFIRMATION DE COMMANDE</h1><p>N° <strong><span data-value="name">N°</span></strong></p></td>
  <td style="text-align:right"><p><strong><span data-value="doc.company">Société</span></strong></p></td>
  </tr></tbody></table>
  <table data-style="boxed"><tbody>
  <tr><th>Client</th><th>Références</th></tr>
  <tr><td><p><strong><span data-value="doc.customer_name">Client</span></strong></p>
  <p><span data-value="doc.customer_address">Adresse</span></p></td>
  <td><p>Date : <span data-value="doc.transaction_date">Date</span></p>
  <p>Livraison prévue : <span data-value="doc.delivery_date">Livraison</span></p>
  <p>Votre commande : <span data-value="doc.po_no">Bon de commande</span></p></td></tr>
  </tbody></table>
  <p></p>
  <div data-block='{"type":"table","field":"items","style":"accent","columns":[{"field":"item_code","label":"Réf.","width":13},{"field":"item_name","label":"Désignation","width":31},{"field":"delivery_date","label":"Livraison","width":12},{"field":"qty","label":"Qté","align":"right","width":9},{"field":"uom","label":"Unité","width":9},{"field":"rate","label":"Prix unitaire","align":"right","width":13},{"field":"amount","label":"Montant","align":"right","width":13}]}'></div>
  <table data-style="plain"><tbody><tr>
  <td style="width:55%"></td>
  <td><table data-style="boxed"><tbody>
  <tr><th colspan="2">Récapitulatif</th></tr>
  <tr><td>Total HT</td><td style="text-align:right"><span data-value="doc.net_total">Total HT</span></td></tr>
  <tr><td>Taxes</td><td style="text-align:right"><span data-value="doc.total_taxes_and_charges">Taxes</span></td></tr>
  <tr><td><strong>Total TTC</strong></td><td style="text-align:right"><strong><span data-value="doc.grand_total">Total TTC</span></strong></td></tr>
  </tbody></table></td>
  </tr></tbody></table>
  <p>Conditions : <span data-value="doc.tc_name">Conditions générales</span></p>
