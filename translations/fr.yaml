  ? If "Months" is selected, a fixed amount will be booked as deferred revenue or expense for each month irrespective of the number of days in a month. It will be prorated if deferred revenue or expense is not booked for an entire month
  : Si « Mois » est choisi, un montant fixe est comptabilisé en produit ou charge différé chaque mois, quel que soit le nombre de jours du mois. Il est proratisé si le produit ou la charge différé n'est pas comptabilisé pour un mois entier
  ? 'If <b>Enabled</b> - Reconciliation happens on the <b>Advance Payment posting date</b><br>

    If <b>Disabled</b> - Reconciliation happens on oldest of 2 Dates: <b>Invoice Date</b> or the <b>Advance Payment posting date</b><br>'
  : 'Si <b>activé</b> : le rapprochement a lieu à la <b>date de comptabilisation du paiement d''avance</b><br>

    Si <b>désactivé</b> : le rapprochement a lieu à la plus ancienne des deux dates, <b>date de facture</b> ou <b>date de comptabilisation du paiement d''avance</b><br>'
  If blank, parent Warehouse Account or company default will be considered in transactions: Si vide, le compte de l'entrepôt parent ou celui de la société par défaut est utilisé dans les transactions
  If checked, journal entries made using bank reconciliation will be of type "Credit Card Entry": Si coché, les écritures comptables passées par le rapprochement bancaire sont de type « Écriture de carte de crédit »
  If checked, picked qty won't automatically be fulfilled on submit of pick list.: Si coché, la quantité prélevée n'est pas honorée automatiquement à la soumission de la liste de prélèvement.
  If checked, Stock will be reserved on <b>Submit</b>: Si coché, le stock est réservé à la <b>soumission</b>
  ? If checked, the entire amount (e.g. Freight) is allocated to the valuation of stock & asset items only. If unchecked, the amount is distributed across all items and the portion belonging to non-stock items is not added to valuation.
  : Si coché, tout le montant (ex. le transport) est affecté à la valorisation des articles stockés et des immobilisations uniquement. Sinon, il est réparti sur tous les articles et la part des articles non stockés n'entre pas dans la valorisation.
  If checked, the rejected quantity is billed anywhere in the purchase cycle.: Si coché, la quantité refusée est facturée à n'importe quelle étape du cycle d'achat.
  If checked, the tax amount will be considered as already included in the Paid Amount in Payment Entry: Si coché, le montant de la taxe est considéré comme déjà inclus dans le montant payé du paiement
  If checked, the tax amount will be considered as already included in the Print Rate / Print Amount: Si coché, le montant de la taxe est considéré comme déjà inclus dans le prix / montant imprimé
  If checked, this Customer is only available for transactions in the companies listed below.: Si coché, ce client n'est disponible que pour les transactions des sociétés listées ci-dessous.
  If checked, this Item is only available for transactions in the companies listed below.: Si coché, cet article n'est disponible que pour les transactions des sociétés listées ci-dessous.
  ? If checked, this item is treated as drop-shipped by default in Sales Orders, Sales Invoices and Purchase Orders. The flag can be overridden on each transaction line.
  : Si coché, cet article est traité par défaut en livraison directe dans les commandes client, factures de vente et commandes fournisseur. Le choix peut être changé ligne par ligne.
  If checked, this Supplier is only available for transactions in the companies listed below.: Si coché, ce fournisseur n'est disponible que pour les transactions des sociétés listées ci-dessous.
  ? If checked, updates inventory; stock and accounting entries are created together. Leave unchecked if a Delivery Note is created separately.
  : 'Si coché, met à jour le stock : les écritures de stock et comptables sont créées ensemble. Laissez décoché si un bon de livraison est créé séparément.'
  ? If checked, updates inventory; stock and accounting entries are created together. Leave unchecked if a Purchase Receipt is created separately.
  : 'Si coché, met à jour le stock : les écritures de stock et comptables sont créées ensemble. Laissez décoché si un bon de réception est créé séparément.'
  If disable, 'In Words' field will not be visible in any transaction: Si désactivé, le champ « En lettres » n'apparaît dans aucune transaction
  If disable, 'Rounded Total' field will not be visible in any transaction: Si désactivé, le champ « Total arrondi » n'apparaît dans aucune transaction
  If enabled then system won't apply the pricing rule on the delivery note which will be create from the pick list: Si activé, la règle de prix n'est pas appliquée au bon de livraison créé depuis la liste de prélèvement
  If enabled then system won't override the picked qty / batches / serial numbers / warehouse.: Si activé, la quantité / les lots / les n° de série / l'entrepôt prélevés ne sont pas écrasés.
  If enabled, a print of this document will be attached to each email: Si activé, une impression de ce document est jointe à chaque e-mail
  ? If enabled, a weekly scheduler scans the Stock Ledger Variance for item-warehouses with incorrect valuation in the current financial year and auto-creates Item & Warehouse based reposts to fix them.
  : Si activé, une tâche hebdomadaire analyse les écarts du grand livre de stock des couples article-entrepôt mal valorisés sur l'exercice en cours et crée automatiquement leur recomptabilisation.
  If enabled, additional ledger entries will be made for discounts in a separate Discount Account: Si activé, des écritures supplémentaires sont passées pour les remises sur un compte de remise distinct
  If enabled, all files attached to this document will be attached to each email: Si activé, tous les fichiers joints à ce document sont joints à chaque e-mail
  ? "If enabled, do not update serial / batch values in the stock transactions on creation of auto Serial \n / Batch Bundle."
  : "Si activé, ne pas mettre à jour les n° de série / lots des transactions de stock à la création automatique du lot de n° de série \n / lots."
  If enabled, ledger entries will be posted for change amount in POS transactions: Si activé, des écritures sont passées pour la monnaie rendue dans les transactions du point de vente
  If enabled, rule matching algorithm will run every hour: Si activé, l'algorithme de correspondance des règles s'exécute toutes les heures
  If enabled, sales from this item will be included in Sales Person and Sales Partner commission calculations: Si activé, les ventes de cet article entrent dans le calcul des commissions des commerciaux et des partenaires
  ? If enabled, system will allow user to deliver the entire quantity of the finished goods produced against the Subcontracting Inward Order. If disabled, system will allow delivery of only the ordered quantity.
  : Si activé, toute la quantité de produits finis fabriquée sur la commande de sous-traitance reçue peut être livrée. Sinon, seule la quantité commandée peut l'être.
  If enabled, system will set incoming rate as zero for stand-alone credit notes with expired batch item.: Si activé, le prix d'entrée est mis à zéro sur les avoirs isolés portant un article de lot expiré.
  If enabled, the consolidated invoices will have rounded total disabled: Si activé, les factures consolidées n'ont pas de total arrondi
  ? If enabled, the item rate won't adjust to the valuation rate during internal transfers, but accounting will still use the valuation rate. This will allow the user to specify a different rate for printing or taxation purposes.
  : Si activé, le prix de l'article ne s'aligne pas sur le taux de valorisation lors des transferts internes, mais la comptabilité utilise toujours le taux de valorisation. Cela permet un autre prix pour l'impression ou la fiscalité.
  ? If enabled, the Secondary Items generated against a Finished Good will also be added in the Stock Entry when delivering that Finished Good.
  : Si activé, les articles secondaires produits avec un produit fini sont aussi ajoutés au mouvement de stock à la livraison de ce produit fini.
  ? If enabled, the source and target warehouse in the Material Transfer Stock Entry must be different else an error will be thrown. If inventory dimensions are present, same source and target warehouse can be allowed but atleast any one of the inventory dimension fields must be different.
  : Si activé, les entrepôts source et cible d'un transfert de matière doivent être différents, sinon une erreur est levée. Avec des axes de stock, un même entrepôt est permis à condition qu'au moins un des axes diffère.
  ? If enabled, the system will allow negative stock entries for the batch. But, this may lead to incorrect valuation rates, so it is recommended to avoid using this option. The system will permit negative stock only when it is caused by backdated entries and will validate and block negative stock in all other cases.
  : 'Si activé, le stock négatif est permis pour le lot. Cela peut fausser les taux de valorisation : mieux vaut l''éviter. Le stock négatif n''est permis que s''il résulte d''écritures antidatées ; dans tous les autres cas, il est refusé.'
  ? If enabled, the system will allow selecting UOMs in sales and purchase transactions only if the conversion rate is set in the item master.
  : Si activé, une UdM ne peut être choisie dans les ventes et les achats que si son taux de conversion est défini sur la fiche article.
  If enabled, the system will generate an accounting entry for material rejected anywhere in the purchase cycle.: Si activé, une écriture comptable est générée pour la matière refusée à n'importe quelle étape du cycle d'achat.
  ? If enabled, the system will use the inventory account set in the Item Master or Item Group or Brand. Otherwise, it will use the inventory account set in the Warehouse.
  : Si activé, le compte de stock de la fiche article, du groupe d'articles ou de la marque est utilisé. Sinon, celui de l'entrepôt.
  ? If enabled, the system will use the moving average valuation method to calculate the valuation rate for the batched items and will not consider the individual batch-wise incoming rate.
  : Si activé, la valorisation des articles en lots se fait au coût moyen pondéré, sans tenir compte du prix d'entrée de chaque lot.
  If enabled, the value of goods delivered before invoicing will be recorded in the Stock Delivered But Not Billed account.: Si activé, la valeur des marchandises livrées avant facturation est enregistrée sur le compte « Stock livré non facturé ».
  ? If enabled, then system will only validate the pricing rule and not apply automatically. User has to manually set the discount percentage / margin / free items to validate the pricing rule
  : 'Si activé, la règle de prix est seulement contrôlée, pas appliquée automatiquement : l''utilisateur saisit lui-même le pourcentage de remise / la marge / les articles gratuits'
  If enabled, this row's values will be displayed on financial charts: Si activé, les valeurs de cette ligne apparaissent sur les graphiques financiers
  If enabled, user will be alerted before resetting posting date to current date in relevant transactions: Si activé, l'utilisateur est prévenu avant que la date de comptabilisation soit ramenée à la date du jour dans les transactions concernées
  If enabled, users must enter Serial No. / Batch data manually instead of using the selector dialog.: Si activé, les n° de série / lots se saisissent à la main au lieu de la fenêtre de sélection.
  If Income or Expense: Si produit ou charge
  ? If item is a variant of another item then description, image, pricing, taxes etc will be set from the template unless explicitly specified
  : Si l'article est une variante d'un autre, sa description, son image, ses prix, ses taxes, etc. sont repris du modèle sauf indication contraire
  If more than one package of the same type (for print): S'il y a plus d'un colis du même type (à l'impression)
  ? If no Item Price is found for an item in the Price List set in the transaction, prices from the Default Price List will be fetched.
  : Si aucun prix n'est trouvé pour un article dans la liste de prix de la transaction, les prix de la liste de prix par défaut sont repris.
  ? If no taxes are set, and Taxes and Charges Template is selected, the system will automatically apply the taxes from the chosen template.
  : Si aucune taxe n'est renseignée et qu'un modèle de taxes et frais est choisi, les taxes de ce modèle sont appliquées automatiquement.
  If rate is zero then item will be treated as "Free Item": Si le prix est nul, l'article est traité comme un « article gratuit »
  If set, accounting entries for this customer will post to these accounts instead of the company default.: Si renseignés, les écritures comptables de ce client sont passées sur ces comptes au lieu de ceux de la société par défaut.
  ? If set, the system does not use the user's Email or the standard outgoing Email account for sending request for quotations.
  : Si renseigné, ni l'e-mail de l'utilisateur ni le compte d'e-mail sortant standard ne servent à envoyer les demandes de devis.
  If the account is frozen, entries are allowed to restricted users.: Si le compte est gelé, seuls les utilisateurs autorisés peuvent y passer des écritures.
  ? If the reorder check is set at the Group warehouse level, the available quantity becomes the sum of the projected quantities of all its child warehouses.
  : Si le contrôle de réapprovisionnement est fixé sur un entrepôt de regroupement, la quantité disponible est la somme des quantités prévisionnelles de ses entrepôts enfants.
  ? If this checkbox is checked, paid amount will be splitted and allocated as per the amounts in payment schedule against each payment term
  : Si coché, le montant payé est fractionné et affecté selon les montants de l'échéancier de paiement, par condition de paiement
  ? If this is checked subsequent new invoices will be created on calendar  month and quarter start dates irrespective of current invoice start date
  : Si coché, les factures suivantes sont créées aux débuts de mois et de trimestre civils, quelle que soit la date de début de la facture en cours
  If this is unchecked Journal Entries will be saved in a Draft state and will have to be submitted manually: Si décoché, les écritures comptables sont enregistrées en brouillon et doivent être soumises à la main
  If this is unchecked, direct GL entries will be created to book deferred revenue or expense: Si décoché, des écritures directes au grand livre comptabilisent les produits ou charges différés
  If this item has variants, then it cannot be selected in sales orders etc.: Si cet article a des variantes, il ne peut pas être choisi dans les commandes client, etc.
  If yes, then this warehouse will be used to store rejected materials: Si oui, cet entrepôt sert à stocker les matières refusées
  If your CSV uses a different delimiter, add that character here, ensuring no spaces or additional characters are included.: Si votre CSV utilise un autre séparateur, ajoutez ce caractère ici, sans espace ni autre caractère.
