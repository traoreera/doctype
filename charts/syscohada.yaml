# Plan comptable SYSCOHADA révisé (Acte uniforme OHADA relatif au droit comptable et à l'information financière, 2017).
#
# Des DONNÉES, pas un DocType : le plugin `accounts` (hors de ce dépôt, process/plan-erp.md) crée les comptes (`Account`) d'une
# société à partir de ce fichier quand `Company.create_chart_of_accounts_based_on` vaut « SYSCOHADA révisé ». Hors de doctypes/
# exprès : tout fichier de cet arbre-là est lu comme un DocType.
#
# Forme d'un compte : `number` (chiffres seulement ; le premier est la CLASSE), `name`, `group` (un compte de regroupement, qui n'est
# jamais mouvementé), `parent` (le NUMÉRO du compte parent : les comptes sont nommés au hasard, le numéro est la seule clé stable),
# `root_type` / `report_type` (les champs du même nom d'`Account`), `account_type` facultatif (le rôle d'un compte clé pour le
# moteur : client, fournisseur, banque, caisse, taxe, stock…). Une classe dont les comptes sont de natures différentes (1 et 4) n'a pas
# de `root_type` : il est porté par ses comptes.
#
# PÉRIMÈTRE ET LIMITES — À FAIRE VALIDER PAR UN EXPERT-COMPTABLE AVANT LA PRODUCTION :
# - les 9 classes, les comptes principaux à 2 chiffres et les comptes divisionnaires à 3 chiffres d'usage courant seulement ; une
#   entreprise ouvre ses sous-comptes (4 chiffres et plus) sous ceux-ci, selon son activité ;
# - transcrit de mémoire du plan publié, PAS d'une source vérifiée ligne à ligne : un numéro ou un intitulé faux dans un plan
#   comptable se paie cher (états financiers, déclarations fiscales). `tests/unit/test_syscohada.py` garantit la COHÉRENCE du fichier
#   (numéros, filiation, classes, nature bilan / résultat), pas son exactitude réglementaire.
