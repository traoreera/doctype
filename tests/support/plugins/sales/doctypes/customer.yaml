# Exemple de process/doctype.md §9, limité à ce que le moteur applique (phases 1 et 2).
schema_version: 1
name: Customer
label: Client
module: sales
icon: users
naming: hash
title_field: customer_name
fields:
- { fieldname: customer_name, label: Nom, fieldtype: Text, required: true, in_list_view: true, description: Raison sociale ou nom complet }
- { fieldname: type, label: Type, fieldtype: Select, options: [Particulier, Entreprise], in_list_view: true }
# Obligatoire SEULEMENT quand le champ est visible : `required` + `depends_on`. Le serveur revérifie à l'écriture.
- { fieldname: company_id, label: N° entreprise, fieldtype: Text, required: true, depends_on: "type == 'Entreprise'" }
- { fieldname: credit_limit, label: Plafond, fieldtype: Number, default: 0, in_list_view: true, read_only_depends_on: "blocked" }
- { fieldname: approver, label: Validateur, fieldtype: Text, mandatory_depends_on: "credit_limit > 10000", depends_on: "credit_limit > 0" }
- { fieldname: blocked, label: Compte bloqué, fieldtype: Boolean }
- { fieldname: since, label: Client depuis, fieldtype: Date }
- { fieldname: country, label: Pays, fieldtype: Link, options: Country, in_list_view: true }
# Présentation : sections et colonnes (les champs non placés vont dans un dernier bloc, ils ne disparaissent jamais).
layout:
- section: Général
  columns: [[customer_name, type, company_id], [country, since]]
- section: Crédit
  columns: [[credit_limit, approver], [blocked]]
# Autorisation : AUCUN bloc obligatoire. Par convention, `module` + le nom du DocType donnent les grants :
#   read -> sales:customer:read ; write et create -> sales:customer:write ; delete -> sales:customer:delete
# auth (xauth) compose déjà rôles et grants à chaque requête : on ne redécrit pas de matrice ici. Le plugin PROPRIÉTAIRE
# (`sales`) transmet à `rbac.declare` la liste fournie par le service `doctype_grants`, au lieu de la retaper dans `rbac.grants`.
# Une action ne retombe sur la convention que si elle n'est pas listée ; `[]` la ferme à tout le monde.
# Modifier ou supprimer exige aussi de pouvoir lire le document. `match` est gelé (process/phase1.md §7).

permissions:
  read: [sales:customer:read, { grant: sales:customer:own, if_owner: true }]       # ses propres clients seulement
  write: [sales:customer:write, { grant: sales:customer:own, if_owner: true }]
  create: [sales:customer:write, { grant: sales:customer:own, if_owner: true }]
