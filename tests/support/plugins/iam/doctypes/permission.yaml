# Le CATALOGUE des permissions de l'installation : ce que chaque plugin a déclaré (`rbac.declare`), tel qu'xauth le connaît. DocType VIRTUEL, en lecture seule :
# sa liste a les filtres, le tri, la recherche, les colonnes, l'export et le rapport de n'importe quel DocType. Le nom d'un document est le nom de la
# permission (`sales:invoice:read`). Un propriétaire d'organisation ne voit que ce qu'il peut déléguer ; l'administrateur de la plateforme voit tout.
schema_version: 1
name: Permission
label: Permission
module: iam
icon: key
source: xauth
title_field: code
fields:
  - { fieldname: code, label: Permission, fieldtype: Text, read_only: true, in_list_view: true, description: "Le nom technique, tel que les grants le citent" }
  - { fieldname: description, label: Description, fieldtype: Text, read_only: true, in_list_view: true }
  - { fieldname: plugin, label: Plugin, fieldtype: Text, read_only: true, in_list_view: true }
  - { fieldname: grant_group, label: Groupe, fieldtype: Text, read_only: true, in_list_view: true }
  - { fieldname: tenant_grantable, label: Délégable, fieldtype: Boolean, read_only: true, in_list_view: true, description: "Un propriétaire d'organisation peut l'accorder à ses membres" }
  - { fieldname: active, label: Active, fieldtype: Boolean, read_only: true, in_list_view: true, description: "Désactivée quand le plugin qui la déclare est retiré" }
layout:
  - section: Permission
    columns: [[code, description, plugin], [grant_group, tenant_grantable, active]]
permissions:
  write: []
  create: []
  delete: []
views:
  default: report
permissions:
  read: [{ grant: iam:permission:read, tenant_grantable: false }]
  write: []
  create: []
  delete: []
