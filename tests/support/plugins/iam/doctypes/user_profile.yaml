# Le PROFIL d'un utilisateur : comment il s'appelle, sa photo, comment le joindre, ses préférences. Un document par utilisateur, nommé comme son compte xauth
# (`naming: owner`) : chacun crée et modifie le sien SANS aucun grant (`@authenticated`), tout le monde lit ceux des collègues (l'annuaire). Un gestionnaire
# (`iam:profile:write`) corrige celui d'un autre, et supprime (`iam:profile:delete`). La fiche RH d'un employé (Employee.user) pointe vers le compte, pas
# vers ce profil : le profil appartient à l'utilisateur, la fiche à l'entreprise.
schema_version: 1
name: User Profile
label: Profil
module: iam
icon: id-card
naming: owner
title_field: full_name
image_field: photo
fields:
  - { fieldname: photo, label: Photo, fieldtype: Image, max_mb: 5 }
  - { fieldname: full_name, label: Nom affiché, fieldtype: Text, required: true, in_list_view: true, description: "Comment les autres vous voient (commentaires, tâches, listes)" }
  - { fieldname: job_title, label: Fonction, fieldtype: Text, in_list_view: true }
  - { fieldname: email, label: E-mail professionnel, fieldtype: Text, format: email, in_list_view: true }
  - { fieldname: phone, label: Téléphone, fieldtype: Text, format: phone, in_list_view: true }
  - { fieldname: language, label: Langue, fieldtype: Select, options: [Français, English], default: Français }
  - { fieldname: timezone, label: Fuseau horaire, fieldtype: Text, description: "Nom IANA, par exemple Europe/Paris ou Africa/Abidjan" }
  - { fieldname: theme, label: Thème, fieldtype: Select, options: [Automatique, Clair, Sombre], default: Automatique }
  - { fieldname: signature, label: Signature, fieldtype: LongText }
layout:
  - section: Identité
    columns: [[photo, full_name, job_title], [email, phone]]
  - section: Préférences
    columns: [[language, timezone], [theme]]
  - section: Signature
    collapsible: true
    columns: [[signature]]
permissions:
  read: ["@authenticated"]
  create: ["@authenticated"]
  write:
    - iam:profile:write
    - { grant: "@authenticated", if_owner: true }
  delete: [iam:profile:delete]
