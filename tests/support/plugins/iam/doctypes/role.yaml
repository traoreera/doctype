# Un rôle : un ensemble de permissions qu'on attribue d'un coup à des membres. Les rôles de la PLATEFORME (admin, user…) sont en lecture seule ; ceux de
# l'ORGANISATION se créent, se modifient et se suppriment ici. DocType VIRTUEL (`source: xauth`) : xauth garde les rôles, ce DocType ne les copie pas.
# Le nom d'un document est l'identifiant du rôle chez xauth ; le titre est son nom.
schema_version: 1
name: Role
label: Rôle
module: iam
icon: shield
source: xauth
title_field: role_name
fields:
  - { fieldname: role_name, label: Nom, fieldtype: Text, required: true, in_list_view: true }
  - { fieldname: description, label: Description, fieldtype: Text, in_list_view: true }
  - { fieldname: scope, label: Portée, fieldtype: Select, options: [Plateforme, Organisation], default: Organisation, read_only: true, in_list_view: true, description: "Un rôle de la plateforme est partagé par toutes les organisations et ne se modifie pas ici" }
  - { fieldname: permissions, label: Permissions, fieldtype: Table, options: Role Permission, description: "Seules les permissions délégables s'accordent à un rôle de l'organisation" }
layout:
  - section: Rôle
    columns: [[role_name, description], [scope]]
  - section: Ce que ce rôle permet
    columns: [[permissions]]
permissions:
  read: [{ grant: iam:role:read, tenant_grantable: false }]
  write: [{ grant: iam:role:write, tenant_grantable: false }]
  create: [{ grant: iam:role:write, tenant_grantable: false }]
  delete: [{ grant: iam:role:delete, tenant_grantable: false }]
