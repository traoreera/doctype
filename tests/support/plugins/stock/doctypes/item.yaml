# L'article : la cible des lignes de mouvement de stock (module stock) ET des lignes de facture du module sales.
schema_version: 1
name: Item
label: Article
module: stock
icon: tag
title_field: item_name
fields:
  - { fieldname: item_name, label: Désignation, fieldtype: Text, required: true, in_list_view: true }
  - { fieldname: uom, label: Unité, fieldtype: Select, options: [pcs, kg, g, l, m], default: pcs, required: true, in_list_view: true }
  # Sous ce seuil, l'article est à réapprovisionner (rapports : phase C). Une quantité exacte, jamais un flottant.
  - { fieldname: reorder_level, label: Seuil de réapprovisionnement, fieldtype: Decimal, decimals: 3, default: 0, in_list_view: true, unit_from: uom }
