name: stock
version: 0.1.0
author: traoreera
description: "Plugin PROPRIÉTAIRE du module stock (quantités, palier 40 % phase A) : articles, entrepôts, mouvements soumettables et journal."
framework_version: ">=2.9"
execution_mode: trusted
entry_point: src/main.py
requires: [xcore-doctype, auth]

# Sans ce bloc, PermissionEngine refuse toute action (deny_all). Seule `balances.verify` existe : un contrôle d'opérateur, appelé par la route
# IPC d'xcore (clé du plugin). Aucun `allowed_callers` : aucun autre plugin ne peut l'appeler (il lit les soldes de n'importe quel tenant).
permissions:
  - { resource: "balances.*", actions: ["execute"], effect: allow }
