# La fiche d'un employé : photo, coordonnées contrôlées (e-mail, téléphone, site), service et responsable (des liens cliquables), salaire en
# devise, évaluation en étoiles, contrat en pièce jointe. Les droits suivent la convention hr:employee:read | write | delete.
schema_version: 1
name: Employee
label: Employé
module: hr
icon: id-card
title_field: full_name
image_field: photo
fields:
  - { fieldname: photo, label: Photo, fieldtype: Image, max_mb: 5 }
  - { fieldname: full_name, label: Nom complet, fieldtype: Text, required: true, in_list_view: true }
  - { fieldname: job_title, label: Poste, fieldtype: Text, in_list_view: true }
  - { fieldname: department, label: Service, fieldtype: Link, options: Department, in_list_view: true }
  - { fieldname: manager, label: Responsable, fieldtype: Link, options: Employee }
  - { fieldname: user, label: Compte, fieldtype: Link, options: Member, description: "Son compte xauth : ses rôles et permissions se gèrent depuis la fiche du compte (la flèche l'ouvre). Passer le statut à « Parti » désactive ce compte." }
  - { fieldname: status, label: Statut, fieldtype: Select, options: [Actif, En congé, Parti], default: Actif, in_list_view: true }
  - { fieldname: email, label: E-mail, fieldtype: Text, format: email }
  - { fieldname: phone, label: Téléphone, fieldtype: Text, format: phone }
  - { fieldname: website, label: Profil en ligne, fieldtype: Text, format: url, description: "Adresse web complète (https://…)" }
  - { fieldname: birth_date, label: Naissance, fieldtype: Date }
  - { fieldname: hire_date, label: Embauche, fieldtype: Date, default: today, in_list_view: true }
  - { fieldname: salary, label: Salaire annuel, fieldtype: Currency, options: EUR }
  - { fieldname: rating, label: Évaluation, fieldtype: Rating, stars: 5 }
  - { fieldname: team_color, label: Couleur d'équipe, fieldtype: Color }
  - { fieldname: bio, label: Présentation, fieldtype: LongText }
  - { fieldname: contract, label: Contrat, fieldtype: Attach, max_mb: 10 }
layout:
  - section: Identité
    columns: [[photo, full_name, job_title], [status, department, manager, user]]
  - section: Coordonnées
    columns: [[email, phone, website], [birth_date, hire_date]]
  - section: Rémunération et suivi
    collapsible: true
    columns: [[salary, rating], [team_color]]
  - section: Dossier
    columns: [[bio], [contract]]
views:
  kanban: { field: status, card_fields: [job_title, department] }      # glisser un employé change son statut
  calendar: { start: hire_date, title: full_name, color: status }       # les dates d'embauche
hooks:
  before_save: [hr.employee_access]   # « Parti » désactive le compte lié (tests/support/plugins/hr/src/access.py)
