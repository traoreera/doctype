# Un service de l'entreprise. L'arborescence (`views.tree`) montre la direction, ses services, leurs équipes.
schema_version: 1
name: Department
label: Service
module: hr
icon: sitemap
title_field: department_name
fields:
  - { fieldname: department_name, label: Nom, fieldtype: Text, required: true, in_list_view: true }
  - { fieldname: parent_department, label: Service parent, fieldtype: Link, options: Department, in_list_view: true }
  - { fieldname: head, label: Responsable, fieldtype: Link, options: Employee, in_list_view: true }
  - { fieldname: color, label: Couleur, fieldtype: Color }

layout:
  - section: Informations
    columns: [[department_name], [parent_department, head]]


views:
  tree: { parent: parent_department }
