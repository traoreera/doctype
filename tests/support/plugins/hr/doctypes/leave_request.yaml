# Une demande de congé : brouillon, soumise (figée), annulée. Numérotée par année (CG-2026-00001).
schema_version: 1
name: Leave Request
label: Demande de congé
module: hr
icon: calendar-plus
submittable: true
naming: { series: "CG-{YYYY}-{#####}" }
title_field: reason
fields:
  - { fieldname: employee, label: Employé, fieldtype: Link, options: Employee, required: true, in_list_view: true }
  - { fieldname: leave_type, label: Type, fieldtype: Select, options: [Congé payé, Maladie, Sans solde, Formation], default: Congé payé, in_list_view: true }
  - { fieldname: from_date, label: Du, fieldtype: Date, required: true, in_list_view: true }
  - { fieldname: to_date, label: Au, fieldtype: Date, required: true, in_list_view: true }
  - { fieldname: reason, label: Motif, fieldtype: Text }
  - { fieldname: comment, label: Commentaire, fieldtype: LongText }
layout:
  - section: Demande
    columns: [[employee, leave_type, reason], [from_date, to_date]]
  - columns: [[comment]]
# L'automate métier vit ICI, dans le YAML du DocType, à côté des champs (process/programme.md §3.2). Il PILOTE `docstatus` au lieu
# de s'y ajouter : un état dit dans quel état de document il met la demande, et c'est la transition qui fait passer les deux
# ensemble. `/submit` et `/cancel` sont alors refusés sur ce type — on passe par une transition, sinon on contournerait
# l'approbation. Chaque transition ouvre son grant (`hr:leave_request:workflow_approuver`…), jamais un rôle.
workflow:
  states:
    - { name: Brouillon }
    - { name: À approuver }
    - { name: Approuvée, docstatus: submitted }
    - { name: Refusée, docstatus: cancelled }
  transitions:
    - { action: Soumettre, from: Brouillon, to: À approuver, description: "Envoyer sa demande au responsable" }
    # `not_owner` : on n'approuve pas sa propre demande. C'est la séparation des pouvoirs, vérifiée par le serveur.
    - { action: Approuver, from: À approuver, to: Approuvée, not_owner: true }
    - { action: Refuser, from: À approuver, to: Refusée, not_owner: true }
    # `condition` : une règle MÉTIER, pas un droit. Rendre une demande sans dire pourquoi n'aide personne, donc l'action n'est
    # même pas proposée tant que le commentaire est vide — le serveur juge la condition sur le document ENREGISTRÉ, aux deux
    # portes (ce que `/transitions` offre, et ce que l'écriture accepte).
    - { action: Reprendre, from: À approuver, to: Brouillon, condition: comment, description: "Rendre la demande à son auteur pour correction (il faut un commentaire)" }

views:
  calendar: { start: from_date, end: to_date, title: employee, color: leave_type }
  gantt: { start: from_date, end: to_date, title: employee, color: leave_type }
