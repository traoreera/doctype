  section: Références
  columns:
  - - naming_series
    - item_code
    - item_name
    - item_group
    - stock_uom
  - - disabled
    - is_stock_item
    - is_fixed_asset
    - auto_create_assets
    - is_grouped_asset
    - asset_category
- tab: Details
  section: Item Attributes
  columns:
  - - is_sales_item
    - allow_alternative_item
    - has_variants
  - - is_purchase_item
    - is_customer_provided_item
- tab: Details
  section: Comptabilité et montants
  columns:
  - - standard_rate
- tab: Details
  section: Informations complémentaires 4
  columns:
  - - over_delivery_receipt_allowance
  - - over_billing_allowance
- tab: Details
  section: Company Restrictions
  columns:
  - - restrict_to_companies
    - allowed_companies
- tab: Details
  section: Description
  columns:
  - - brand
    - description
- tab: Accounting
  section: Références
  columns:
  - - item_defaults
- tab: Accounting
  section: Deferred Accounting
  columns:
  - - enable_deferred_expense
    - no_of_months_exp
  - - enable_deferred_revenue
    - no_of_months
- tab: UOM
  section: Informations complémentaires 9
  columns:
  - - uoms
- tab: Tax
  section: Comptabilité et montants
  columns:
  - - taxes
- tab: Tax
  section: Comptabilité et montants
  columns:
  - - purchase_tax_withholding_category
  - - sales_tax_withholding_category
- tab: Inventory
  section: Inventory Valuation
  columns:
  - - valuation_method
  - - valuation_rate
- tab: Inventory
  section: Inventory Settings
  columns:
  - - end_of_life
    - default_material_request_type
  - - warranty_period
    - weight_per_unit
    - weight_uom
    - allow_negative_stock
- tab: Inventory
  section: Barcodes
  columns:
  - - barcodes
- tab: Inventory
  section: Auto re-order
  columns:
  - - reorder_levels
- tab: Inventory
  section: Serial Nos / Batches
  columns:
  - - has_batch_no
    - create_new_batch
    - batch_number_series
    - has_expiry_date
    - shelf_life_in_days
    - retain_sample
    - sample_quantity
  - - has_serial_no
    - serial_no_series
    - use_serial_no_wise_valuation
- tab: Variants
  section: Informations complémentaires 17
  columns:
  - - variant_of
    - variant_based_on
- tab: Purchasing
  section: Comptabilité et montants
  columns:
  - - purchase_uom
    - min_order_qty
    - safety_stock
  - - lead_time_days
    - last_purchase_rate
- tab: Purchasing
  section: Supplier Details
  columns:
  - - delivered_by_supplier
- tab: Purchasing
  section: Références
  columns:
  - - supplier_items
- tab: Purchasing
  section: Foreign Trade Details
  columns:
  - - country_of_origin
  - - customs_tariff_number
- tab: Sales
  section: État et options
  columns:
  - - sales_uom
    - grant_commission
  - - max_discount
- tab: Sales
  section: Customer Details
  columns:
  - - customer_items
