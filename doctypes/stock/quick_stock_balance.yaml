schema_version: 1
name: Quick Stock Balance
label: Quick Stock Balance
module: stock
icon: scale
fields:
- fieldname: warehouse
  label: Warehouse
  fieldtype: Link
  options: Warehouse
  required: true
  in_list_view: true
- fieldname: item
  label: Item Code
  fieldtype: Link
  options: Item
  required: true
  in_list_view: true
- fieldname: item_barcode
  label: Item Barcode
  fieldtype: Text
- fieldname: item_name
  label: Item Name
  fieldtype: Text
  read_only: true
  fetch_from: item.item_name
- fieldname: item_description
  label: Item Description
  fieldtype: LongText
  read_only: true
- fieldname: qty
  label: Available Quantity
  fieldtype: Decimal
  decimals: 3
  read_only: true
- fieldname: value
  label: Stock Value
  fieldtype: Currency
  decimals: 2
  read_only: true
- fieldname: image
  label: Image View
  fieldtype: Image
- fieldname: date
  label: Date
  fieldtype: Date
  required: true
  in_list_view: true
  default: today
title_field: item_name
layout:
- section: Dates et planification
  columns:
  - - warehouse
    - date
    - item_barcode
    - item
  - - item_name
    - item_description
    - image
- section: Informations complémentaires 2
  columns:
  - - qty
  - - value
views:
  calendar:
    start: date
    title: item_name
