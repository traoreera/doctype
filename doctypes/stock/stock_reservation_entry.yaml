    - voucher_detail_no
  - - voucher_qty
    - available_qty
  - - reserved_qty
    - delivered_qty
- tab: General
  section: Item Information
  columns:
  - - item_code
    - warehouse
  - - stock_uom
    - has_serial_no
    - has_batch_no
  - - from_voucher_type
    - from_voucher_no
    - from_voucher_detail_no
- tab: General
  section: Informations complémentaires 3
  columns:
  - - transferred_qty
  - - consumed_qty
- tab: Serial and Batch Reservation
  section: Informations complémentaires 4
  columns:
  - - reservation_based_on
    - sb_entries
- tab: More Information
  section: Dates et planification
  columns:
  - - company
  - - project
    - status
    - amended_from
views:
  tree:
    parent: amended_from
