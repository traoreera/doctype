  fieldtype: DynamicLink
  read_only: true
  options: voucher_type
- fieldname: voucher_detail_no
  label: Voucher Detail No
  fieldtype: Text
  read_only: true
- fieldname: stock_uom
  label: Stock UOM
  fieldtype: Link
  options: UOM
  read_only: true
- fieldname: project
  label: Project
  fieldtype: Link
  options: Project
  read_only: true
- fieldname: company
  label: Company
  fieldtype: Link
  options: Company
  read_only: true
- fieldname: reserved_qty
  label: Reserved Qty
  fieldtype: Number
  in_list_view: true
  read_only: true
- fieldname: status
  label: Status
  fieldtype: Select
  options:
  - Draft
  - Partially Reserved
  - Reserved
  - Partially Delivered
  - Partially Used
  - Delivered
  - Cancelled
  - Closed
  default: Draft
  read_only: true
- fieldname: delivered_qty
  label: Delivered Qty
  fieldtype: Number
  read_only: true
- fieldname: amended_from
  label: Amended From
  fieldtype: Link
  options: Stock Reservation Entry
  read_only: true
- fieldname: available_qty
  label: Available Qty to Reserve
  fieldtype: Number
  read_only: true
- fieldname: voucher_qty
  label: Voucher Qty
  fieldtype: Number
  read_only: true
- fieldname: has_serial_no
  label: Has Serial No
  fieldtype: Boolean
  read_only: true
- fieldname: has_batch_no
  label: Has Batch No
  fieldtype: Boolean
  read_only: true
- fieldname: sb_entries
  label: Sb Entries
  fieldtype: Table
  options: Serial and Batch Entry
- fieldname: reservation_based_on
  label: Reservation Based On
  fieldtype: Select
  options:
  - Qty
  - Serial and Batch
  default: Qty
  read_only: true
- fieldname: from_voucher_type
  label: From Voucher Type
  fieldtype: Text
  read_only: true
- fieldname: from_voucher_detail_no
  label: From Voucher Detail No
  fieldtype: Text
  read_only: true
- fieldname: from_voucher_no
  label: From Voucher No
  fieldtype: DynamicLink
  read_only: true
  options: from_voucher_type
- fieldname: consumed_qty
  label: Consumed Qty
