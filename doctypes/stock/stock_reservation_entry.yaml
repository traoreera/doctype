schema_version: 1
name: Stock Reservation Entry
label: Stock Reservation Entry
module: stock
submittable: true
icon: bookmark
fields:
- fieldname: item_code
  label: Item Code
  fieldtype: Link
  options: Item
  in_list_view: true
  read_only: true
- fieldname: warehouse
  label: Warehouse
  fieldtype: Link
  options: Warehouse
  in_list_view: true
  read_only: true
- fieldname: voucher_type
  label: Voucher Type
  fieldtype: Text
  read_only: true
- fieldname: voucher_no
