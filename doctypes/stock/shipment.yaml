- fieldname: pickup_address
  label: Pickup Address
  fieldtype: TextEditor
  read_only: true
- fieldname: pickup_contact_name
  label: Contact
  fieldtype: Link
  options: Contact
- fieldname: pickup_contact_email
  label: Contact Email
  fieldtype: Text
  read_only: true
