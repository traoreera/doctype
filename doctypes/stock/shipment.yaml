- fieldname: delivery_contact
  label: Delivery Contact
  fieldtype: TextEditor
  read_only: true
- fieldname: shipment_parcel
  label: Shipment Parcel
  fieldtype: Table
  options: Shipment Parcel
- fieldname: parcel_template
