    - pickup_company
    - pickup_customer
    - pickup_supplier
    - pickup_address_name
    - pickup_address
    - pickup_contact_person
    - pickup_contact_name
    - pickup_contact
  - - delivery_to_type
    - delivery_company
    - delivery_customer
    - delivery_supplier
    - delivery_address_name
    - delivery_address
    - delivery_contact_name
    - delivery_contact
- section: Parcels
  columns:
  - - shipment_parcel
    - parcel_template
    - total_weight
  - - shipment_delivery_note
- section: Shipment details
  columns:
  - - pallets
    - value_of_goods
    - pickup_date
    - pickup_from
    - pickup_to
  - - shipment_type
    - pickup_type
    - incoterm
    - description_of_content
- section: Shipment Information
  columns:
  - - service_provider
    - shipment_id
    - shipment_amount
    - status
  - - carrier
    - carrier_service
    - awb_number
    - tracking_status
    - tracking_status_info
