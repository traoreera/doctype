- fieldname: service_provider
  label: Service Provider
  fieldtype: Text
- fieldname: shipment_id
  label: Shipment ID
  fieldtype: Text
- fieldname: shipment_amount
  label: Shipment Amount
  fieldtype: Currency
  decimals: 2
