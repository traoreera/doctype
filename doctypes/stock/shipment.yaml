- fieldname: delivery_address_name
  label: Address
  fieldtype: Link
  options: Address
  required: true
- fieldname: delivery_address
  label: Delivery Address
  fieldtype: TextEditor
  read_only: true
- fieldname: delivery_contact_name
  label: Contact
  fieldtype: Link
  options: Contact
- fieldname: delivery_contact_email
  label: Contact Email
  fieldtype: Text
  read_only: true
