- fieldname: pickup_contact
  label: Pickup Contact
  fieldtype: TextEditor
  read_only: true
- fieldname: delivery_to_type
  label: Delivery to
  fieldtype: Select
  options:
  - Company
  - Customer
  - Supplier
  default: Customer
- fieldname: delivery_company
  label: Company
  fieldtype: Link
  options: Company
- fieldname: delivery_customer
  label: Customer
  fieldtype: Link
  options: Customer
- fieldname: delivery_supplier
  label: Supplier
  fieldtype: Link
  options: Supplier
- fieldname: delivery_to
  label: Delivery To
  fieldtype: Text
  in_list_view: true
  read_only: true
