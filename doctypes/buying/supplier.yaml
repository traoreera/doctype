schema_version: 1
name: Supplier
label: Supplier
module: buying
icon: truck
fields:
- fieldname: naming_series
  label: Series
  fieldtype: Select
  options:
  - SUP-.YYYY.-
- fieldname: supplier_name
  label: Supplier Name
  fieldtype: Text
  required: true
- fieldname: country
  label: Country
  fieldtype: Link
  options: Country
- fieldname: default_bank_account
  label: Company Bank Account
  fieldtype: Link
  options: Bank Account
- fieldname: tax_id
  label: Tax ID
  fieldtype: Text
  description: Supplier's tax identification number (e.g. PAN, VAT, GST)
- fieldname: tax_category
  label: Tax Category
  fieldtype: Link
  options: Tax Category
  description: Determines which tax rules apply to this supplier
- fieldname: tax_withholding_category
  label: Tax Withholding Category
  fieldtype: Link
  options: Tax Withholding Category
  description: TDS / withholding tax category applied when paying this supplier
- fieldname: is_transporter
  label: Is Transporter
  fieldtype: Boolean
  description: Enable to make this supplier selectable as a transporter on Delivery Notes and Stock Entries
  default: false
- fieldname: is_internal_supplier
  label: Is Internal Supplier
  fieldtype: Boolean
  description: Used for inter-company transactions
  default: false
- fieldname: represents_company
  label: Represents Company
  fieldtype: Link
  options: Company
  description: Select the related company that this Supplier represents for inter-company transactions.
- fieldname: image
  label: Image
  fieldtype: Image
  hidden: true
- fieldname: supplier_group
  label: Supplier Group
  fieldtype: Link
  options: Supplier Group
  in_list_view: true
- fieldname: supplier_type
  label: Supplier Type
  fieldtype: Select
  options:
  - Company
  - Individual
  - Partnership
  default: Company
  required: true
  in_list_view: true
- fieldname: language
  label: Print Language
  fieldtype: Link
  options: Language
- fieldname: disabled
  label: Disabled
  fieldtype: Boolean
  description: Disabled suppliers are hidden from selection in new transactions but remain in historical records
  default: false
- fieldname: warn_rfqs
  label: Warn RFQs
  fieldtype: Boolean
  read_only: true
  hidden: true
- fieldname: warn_pos
  label: Warn POs
  fieldtype: Boolean
  read_only: true
  hidden: true
- fieldname: prevent_rfqs
  label: Prevent RFQs
  fieldtype: Boolean
  read_only: true
  hidden: true
- fieldname: prevent_pos
  label: Prevent POs
  fieldtype: Boolean
  read_only: true
  hidden: true
- fieldname: companies
  label: Allowed to transact with
  fieldtype: Table
  options: Allowed To Transact With
- fieldname: default_currency
  label: Billing Currency
  fieldtype: Link
  options: Devise
  in_list_view: true
- fieldname: default_price_list
  label: Price List
  fieldtype: Link
  options: Price List
- fieldname: payment_terms
  label: Payment Terms Template
  fieldtype: Link
  options: Payment Terms Template
- fieldname: on_hold
  label: Block Supplier
  fieldtype: Boolean
  description: When enabled, transactions with this supplier will be blocked based on the Hold Type below
  default: false
- fieldname: hold_type
  label: Hold Type
  fieldtype: Select
  options:
  - All
  - Invoices
  - Payments
  default: All
- fieldname: release_date
  label: Release Date
  fieldtype: Date
  description: Leave blank if the Supplier is blocked indefinitely
- fieldname: accounts
  label: Per-Company Accounts
  fieldtype: Table
  options: Party Account
  description: Override the default payable / advance accounts on a per-company basis. Leave blank to use each company's
    defaults from Company settings.
- fieldname: website
  label: Website
  fieldtype: Text
- fieldname: supplier_details
  label: Supplier Details
  fieldtype: LongText
  description: General information about your Supplier
- fieldname: is_frozen
  label: Is Frozen
  fieldtype: Boolean
  description: Frozen suppliers block new transactions and ledger entries until unfrozen. Only users with the role
    set in Company's "Roles Allowed to Set and Edit Frozen Account Entries" can transact.
  default: false
- fieldname: allow_purchase_invoice_creation_without_purchase_order
  label: Allow purchase invoice creation without purchase order
  fieldtype: Boolean
  default: false
- fieldname: allow_purchase_invoice_creation_without_purchase_receipt
  label: Allow purchase invoice creation without purchase receipt
  fieldtype: Boolean
  default: false
- fieldname: supplier_primary_contact
  label: Primary Contact
  fieldtype: Link
  options: Contact
  hidden: true
  description: Reselect, if the chosen contact is edited after save
- fieldname: mobile_no
  label: Mobile No
  fieldtype: Text
  read_only: true
  hidden: true
- fieldname: email_id
  label: Email ID
  fieldtype: Text
  read_only: true
  hidden: true
- fieldname: primary_address
  label: Primary Address Preview
  fieldtype: TextEditor
  read_only: true
  hidden: true
- fieldname: supplier_primary_address
  label: Primary Address
  fieldtype: Link
  options: Address
  hidden: true
  description: Reselect, if the chosen address is edited after save
- fieldname: restrict_to_companies
  label: Restrict to Companies
  fieldtype: Boolean
  description: If checked, this Supplier is only available for transactions in the companies listed below.
  default: false
- fieldname: allowed_companies
  label: Allowed Companies
  fieldtype: Table
  options: Company Restriction
- fieldname: portal_users
  label: Supplier Portal Users
  fieldtype: Table
  options: Portal User
- fieldname: customer_numbers
  label: Customer Numbers
  fieldtype: Table
  options: Customer Number At Supplier
  description: Account / customer numbers assigned to your companies by this supplier (for reconciliation on their
    statements)
- fieldname: tax_withholding_group
  label: Tax Withholding Group
  fieldtype: Link
  options: Tax Withholding Group
  description: Used to pick the correct rate row inside the Tax Withholding Category for this supplier (e.g. Company
    vs Individual rates)
- fieldname: gender
  label: Gender
  fieldtype: Link
  options: Gender
- fieldname: alias
  label: Alias
  fieldtype: Text
title_field: supplier_name
layout:
- tab: Details
  section: Dates et planification
  columns:
  - - naming_series
    - supplier_name
    - alias
    - supplier_type
    - gender
  - - supplier_group
    - country
- tab: Details
  section: Defaults
  columns:
  - - default_currency
    - default_bank_account
  - - default_price_list
    - payment_terms
- tab: Accounting
  section: Default Accounts
  columns:
  - - accounts
- tab: Accounting
  section: Internal Supplier Details
  columns:
  - - is_internal_supplier
    - represents_company
- tab: Accounting
  section: Informations complémentaires 5
  columns:
  - - companies
- tab: Tax
  section: Tax Identification
  columns:
  - - tax_id
    - tax_category
  - - tax_withholding_category
    - tax_withholding_group
- tab: Settings
  section: Company Restrictions
  columns:
  - - restrict_to_companies
    - allowed_companies
- tab: Settings
  section: État et options
  columns:
  - - is_transporter
    - allow_purchase_invoice_creation_without_purchase_order
    - allow_purchase_invoice_creation_without_purchase_receipt
  - - disabled
    - is_frozen
- tab: Settings
  section: Block Supplier
  columns:
  - - on_hold
    - hold_type
    - release_date
- tab: Portal Users
  section: Références
  columns:
  - - portal_users
- tab: More Info
  section: More Information
  columns:
  - - website
    - language
  - - supplier_details
- tab: More Info
  section: Références
  columns:
  - - customer_numbers
