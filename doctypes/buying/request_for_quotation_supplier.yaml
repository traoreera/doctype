- fieldname: contact
  label: Contact
  fieldtype: Link
  options: Contact
  in_list_view: true
- fieldname: quote_status
  label: Quote Status
  fieldtype: Select
  options:
  - Pending
  - Received
  read_only: true
- fieldname: supplier_name
  label: Supplier Name
  fieldtype: Text
  read_only: true
  fetch_from: supplier.supplier_name
- fieldname: email_id
  label: Email ID
  fieldtype: Text
  in_list_view: true
