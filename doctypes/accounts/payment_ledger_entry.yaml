schema_version: 1
name: Payment Ledger Entry
label: Payment Ledger Entry
module: accounts
submittable: true
icon: book-open
fields:
- fieldname: posting_date
  label: Posting Date
  fieldtype: Date
- fieldname: account_type
  label: Account Type
  fieldtype: Select
  options:
  - Receivable
  - Payable
- fieldname: account
  label: Account
  fieldtype: Link
  options: Account
- fieldname: party_type
  label: Party Type
  fieldtype: Text
- fieldname: party
  label: Party
  fieldtype: DynamicLink
  options: party_type
- fieldname: voucher_type
  label: Voucher Type
  fieldtype: Text
- fieldname: voucher_no
  label: Voucher No
  fieldtype: DynamicLink
  options: voucher_type
  in_list_view: true
- fieldname: against_voucher_type
  label: Against Voucher Type
  fieldtype: Text
- fieldname: against_voucher_no
  label: Against Voucher No
  fieldtype: DynamicLink
  options: against_voucher_type
  in_list_view: true
- fieldname: amount
  label: Amount
  fieldtype: Currency
  decimals: 2
  in_list_view: true
- fieldname: account_currency
  label: Currency
  fieldtype: Link
  options: Devise
- fieldname: amount_in_account_currency
  label: Amount in Account Currency
  fieldtype: Currency
  decimals: 2
- fieldname: delinked
  label: DeLinked
  fieldtype: Boolean
  in_list_view: true
  default: false
- fieldname: company
  label: Company
  fieldtype: Link
  options: Company
- fieldname: cost_center
  label: Cost Center
  fieldtype: Link
  options: Cost Center
- fieldname: project
  label: Project
  fieldtype: Link
  options: Project
- fieldname: due_date
  label: Due Date
  fieldtype: Date
- fieldname: finance_book
  label: Finance Book
  fieldtype: Link
  options: Finance Book
- fieldname: remarks
  label: Remarks
  fieldtype: LongText
- fieldname: voucher_detail_no
  label: Voucher Detail No
  fieldtype: Text
title_field: company
layout:
- section: Comptabilité et montants
  columns:
  - - posting_date
    - company
    - account_type
    - account
    - party_type
    - party
    - due_date
    - voucher_detail_no
    - cost_center
    - finance_book
    - voucher_type
    - voucher_no
    - against_voucher_type
    - against_voucher_no
    - amount
    - account_currency
    - amount_in_account_currency
    - delinked
    - remarks
    - project
views:
  calendar:
    start: posting_date
    title: company
  gantt:
    start: posting_date
    end: due_date
    title: company
permissions:
  write: []
  create: []
  delete: []
  submit: []
  cancel: []
