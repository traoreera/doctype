schema_version: 1
name: Process Payment Reconciliation
label: Process Payment Reconciliation
module: accounts
naming:
  series: PPR-{YYYY}-{#####}
submittable: true
icon: scale
fields:
- fieldname: status
  label: Status
  fieldtype: Select
  options:
  - Queued
  - Running
  - Paused
  - Completed
  - Partially Reconciled
  - Failed
  - Cancelled
  read_only: true
- fieldname: company
  label: Company
  fieldtype: Link
  options: Company
  required: true
  in_list_view: true
- fieldname: party_type
  label: Party Type
  fieldtype: Text
  required: true
  in_list_view: true
- fieldname: party
  label: Party
  fieldtype: DynamicLink
  options: party_type
  in_list_view: true
- fieldname: receivable_payable_account
  label: Receivable/Payable Account
  fieldtype: Link
  options: Account
  required: true
  in_list_view: true
- fieldname: from_invoice_date
  label: From Invoice Date
  fieldtype: Date
- fieldname: to_invoice_date
  label: To Invoice Date
  fieldtype: Date
- fieldname: from_payment_date
  label: From Payment Date
  fieldtype: Date
- fieldname: to_payment_date
  label: To Payment Date
  fieldtype: Date
- fieldname: cost_center
  label: Cost Center
  fieldtype: Link
  options: Cost Center
- fieldname: bank_cash_account
  label: Bank/Cash Account
  fieldtype: Link
  options: Account
- fieldname: error_log
  label: Error Log
  fieldtype: LongText
- fieldname: default_advance_account
  label: Default Advance Account
  fieldtype: Link
  options: Account
  description: Only 'Payment Entries' made against this advance account are supported.
title_field: company
layout:
- section: Comptabilité et montants
  columns:
  - - company
    - party_type
  - - party
    - receivable_payable_account
    - default_advance_account
- section: Filters
  columns:
  - - from_invoice_date
    - to_invoice_date
  - - from_payment_date
    - to_payment_date
  - - cost_center
    - bank_cash_account
- section: Status
  columns:
  - - status
    - error_log
