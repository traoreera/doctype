schema_version: 1
name: Budget
label: Budget
module: accounts
submittable: true
icon: piggy-bank
fields:
- fieldname: budget_against
  label: Budget Against
  fieldtype: Select
  options:
  - Cost Center
  - Project
  default: Cost Center
  required: true
  in_list_view: true
- fieldname: company
  label: Company
  fieldtype: Link
  options: Company
  required: true
  in_list_view: true
- fieldname: cost_center
  label: Cost Center
  fieldtype: Link
  options: Cost Center
- fieldname: project
  label: Project
  fieldtype: Link
  options: Project
- fieldname: amended_from
  label: Amended From
  fieldtype: Link
  options: Budget
  read_only: true
- fieldname: applicable_on_material_request
  label: Applicable on Material Request
  fieldtype: Boolean
  default: false
- fieldname: action_if_annual_budget_exceeded_on_mr
  label: Action if Annual Budget Exceeded on MR
  fieldtype: Select
  options:
  - Stop
  - Warn
  - Ignore
  default: Stop
- fieldname: action_if_accumulated_monthly_budget_exceeded_on_mr
  label: Action if Accumulated Monthly Budget Exceeded on MR
  fieldtype: Select
  options:
  - Stop
  - Warn
  - Ignore
  default: Warn
- fieldname: applicable_on_purchase_order
  label: Applicable on Purchase Order
  fieldtype: Boolean
  default: false
- fieldname: action_if_annual_budget_exceeded_on_po
  label: Action if Annual Budget Exceeded on PO
  fieldtype: Select
  options:
  - Stop
  - Warn
  - Ignore
  default: Stop
- fieldname: action_if_accumulated_monthly_budget_exceeded_on_po
  label: Action if Accumulated Monthly Budget Exceeded on PO
  fieldtype: Select
  options:
  - Stop
  - Warn
  - Ignore
  default: Warn
- fieldname: applicable_on_booking_actual_expenses
  label: Applicable on booking actual expenses
  fieldtype: Boolean
  default: false
- fieldname: action_if_annual_budget_exceeded
  label: Action if Annual Budget Exceeded on Actual
  fieldtype: Select
  options:
  - Stop
  - Warn
  - Ignore
  default: Stop
- fieldname: action_if_accumulated_monthly_budget_exceeded
  label: Action if Accumulated Monthly Budget Exceeded on Actual
  fieldtype: Select
  options:
  - Stop
  - Warn
  - Ignore
  default: Warn
- fieldname: naming_series
  label: Series
  fieldtype: Select
  options:
  - BUDGET-.########
  default: BUDGET-.########
  required: true
- fieldname: applicable_on_cumulative_expense
  label: Applicable on Cumulative Expense
  fieldtype: Boolean
  description: (Purchase Order + Material Request + Actual Expense)
  default: false
- fieldname: action_if_annual_exceeded_on_cumulative_expense
  label: Action if Anual Budget Exceeded on Cumulative Expense
  fieldtype: Select
  options:
  - Stop
  - Warn
  - Ignore
- fieldname: action_if_accumulated_monthly_exceeded_on_cumulative_expense
  label: Action if Accumulative Monthly Budget Exceeded on Cumulative Expense
  fieldtype: Select
  options:
  - Stop
  - Warn
  - Ignore
- fieldname: budget_distribution
  label: Budget Distribution
  fieldtype: Table
  options: Budget Distribution
- fieldname: account
  label: Account
  fieldtype: Link
  options: Account
  required: true
  in_list_view: true
- fieldname: budget_amount
  label: Budget Amount
  fieldtype: Currency
  decimals: 2
  required: true
- fieldname: revision_of
  label: Revision Of
  fieldtype: Text
  read_only: true
- fieldname: distribute_equally
  label: Distribute Equally
  fieldtype: Boolean
  default: true
- fieldname: from_fiscal_year
  label: From Fiscal Year
  fieldtype: Link
  options: Fiscal Year
  required: true
- fieldname: to_fiscal_year
  label: To Fiscal Year
  fieldtype: Link
  options: Fiscal Year
  required: true
- fieldname: budget_start_date
  label: Budget Start Date
  fieldtype: Date
  hidden: true
- fieldname: budget_end_date
  label: Budget End Date
  fieldtype: Date
  hidden: true
- fieldname: distribution_frequency
  label: Distribution Frequency
  fieldtype: Select
  options:
  - Monthly
  - Quarterly
  - Half-Yearly
  - Yearly
  default: Monthly
  required: true
- fieldname: budget_distribution_total
  label: Budget Distribution Total
  fieldtype: Currency
  decimals: 2
  read_only: true
title_field: company
layout:
- section: Comptabilité et montants
  columns:
  - - naming_series
    - budget_against
    - company
    - cost_center
    - project
    - account
  - - amended_from
    - from_fiscal_year
    - to_fiscal_year
    - distribution_frequency
    - budget_amount
- section: Informations complémentaires 2
  columns:
  - - distribute_equally
- section: Informations complémentaires 3
  columns:
  - - budget_distribution
- section: Comptabilité et montants
  columns:
  - - budget_distribution_total
- section: Control Action
  columns:
  - - applicable_on_material_request
    - action_if_annual_budget_exceeded_on_mr
    - action_if_accumulated_monthly_budget_exceeded_on_mr
  - - applicable_on_purchase_order
    - action_if_annual_budget_exceeded_on_po
    - action_if_accumulated_monthly_budget_exceeded_on_po
- section: Comptabilité et montants
  columns:
  - - applicable_on_booking_actual_expenses
    - action_if_annual_budget_exceeded
    - action_if_accumulated_monthly_budget_exceeded
- section: Control Action for Cumulative Expense
  columns:
  - - applicable_on_cumulative_expense
    - action_if_annual_exceeded_on_cumulative_expense
    - action_if_accumulated_monthly_exceeded_on_cumulative_expense
- section: Informations complémentaires 8
  columns:
  - - revision_of
views:
  tree:
    parent: amended_from
