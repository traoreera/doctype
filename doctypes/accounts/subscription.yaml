schema_version: 1
name: Subscription
label: Subscription
module: accounts
icon: calendar-sync
fields:
- fieldname: status
  label: Status
  fieldtype: Select
  options:
  - Trialing
  - Active
  - Grace Period
  - Cancelled
  - Unpaid
  - Completed
  - Refunded
  read_only: true
- fieldname: cancelation_date
  label: Cancelation Date
  fieldtype: Date
  read_only: true
- fieldname: trial_period_start
  label: Trial Period Start Date
  fieldtype: Date
- fieldname: trial_period_end
  label: Trial Period End Date
  fieldtype: Date
- fieldname: current_invoice_start
  label: Current Invoice Start
  fieldtype: Date
  read_only: true
- fieldname: current_invoice_end
  label: Current Invoice End
  fieldtype: Date
  read_only: true
- fieldname: next_billing_period_start
  label: Next Billing Period Start
  fieldtype: Date
  read_only: true
- fieldname: next_billing_period_end
  label: Next Billing Period End
  fieldtype: Date
  read_only: true
- fieldname: days_until_due
  label: Days Until Due
  fieldtype: Int
  description: Number of days that the subscriber has to pay invoices generated by this subscription
  default: 0
- fieldname: cancel_at_period_end
  label: Cancel When Period Ends
  fieldtype: Boolean
  default: false
- fieldname: plans
  label: Plans
  fieldtype: Table
  options: Subscription Plan Detail
- fieldname: apply_additional_discount
  label: Apply Additional Discount On
  fieldtype: Select
  options:
  - Grand Total
  - Net Total
- fieldname: additional_discount_percentage
  label: Additional Discount Percentage
  fieldtype: Percent
- fieldname: additional_discount_amount
  label: Additional Discount Amount
  fieldtype: Currency
  decimals: 2
- fieldname: party_type
  label: Party Type
  fieldtype: Text
  required: true
- fieldname: party
  label: Party
  fieldtype: DynamicLink
  options: party_type
  in_list_view: true
- fieldname: sales_tax_template
  label: Sales Taxes and Charges Template
  fieldtype: Link
  options: Sales Taxes and Charges Template
- fieldname: purchase_tax_template
  label: Purchase Taxes and Charges Template
  fieldtype: Link
  options: Purchase Taxes and Charges Template
- fieldname: follow_calendar_months
  label: Follow Calendar Months
  fieldtype: Boolean
  description: If this is checked subsequent new invoices will be created on calendar  month and quarter start dates
    irrespective of current invoice start date
  default: false
- fieldname: generate_new_invoices_past_due_date
  label: Bill Even If Previous Invoice Unpaid
  fieldtype: Boolean
  description: New invoices will be generated as per schedule even if current invoices are unpaid or past due date
  default: false
- fieldname: end_date
  label: Subscription End Date
  fieldtype: Date
- fieldname: start_date
  label: Subscription Start Date
  fieldtype: Date
- fieldname: cost_center
  label: Cost Center
  fieldtype: Link
  options: Cost Center
- fieldname: company
  label: Company
  fieldtype: Link
  options: Company
- fieldname: submit_invoice
  label: Submit Generated Invoices
  fieldtype: Boolean
  default: true
- fieldname: generate_invoice_at
  label: Generate Invoice At
  fieldtype: Select
  options:
  - Postpaid (bill at period end)
  - Prepaid (bill at period start)
  - Bill N days before period start
  default: Postpaid (bill at period end)
  required: true
- fieldname: number_of_days
  label: Number of Days
  fieldtype: Int
title_field: company
layout:
- section: Références
  columns:
  - - party_type
    - party
  - - company
    - status
- section: Subscription Period
  columns:
  - - start_date
    - end_date
    - cancelation_date
    - trial_period_start
    - trial_period_end
    - follow_calendar_months
    - generate_new_invoices_past_due_date
    - submit_invoice
  - - days_until_due
    - generate_invoice_at
    - number_of_days
    - cancel_at_period_end
- section: Billing Period
  columns:
  - - current_invoice_start
    - current_invoice_end
  - - next_billing_period_start
    - next_billing_period_end
- section: Plans
  columns:
  - - plans
- section: Taxes
  columns:
  - - sales_tax_template
    - purchase_tax_template
- section: Discounts
  columns:
  - - apply_additional_discount
  - - additional_discount_percentage
    - additional_discount_amount
- section: Accounting Dimensions
  columns:
  - - cost_center
views:
  calendar:
    start: start_date
    title: company
  gantt:
    start: start_date
    end: end_date
    title: company
