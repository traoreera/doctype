schema_version: 1
name: Cashier Closing
label: Cashier Closing
module: accounts
naming:
  series: CC-{YYYY}-{#####}
submittable: true
icon: lock
fields:
- fieldname: naming_series
  label: Series
  fieldtype: Select
  options:
  - POS-CLO-
  default: POS-CLO-
  read_only: true
- fieldname: user
  label: User
  fieldtype: Text
  required: true
  in_list_view: true
  read_only: true
  format: email
- fieldname: date
  label: Date
  fieldtype: Date
  read_only: true
- fieldname: from_time
  label: From Time
  fieldtype: Time
  required: true
- fieldname: time
  label: To Time
  fieldtype: Time
  required: true
- fieldname: expense
  label: Expense
  fieldtype: Number
  default: 0.0
- fieldname: custody
  label: Custody
  fieldtype: Number
  default: 0.0
- fieldname: returns
  label: Returns
  fieldtype: Number
  default: 0.0
- fieldname: outstanding_amount
  label: Outstanding Amount
  fieldtype: Number
  read_only: true
- fieldname: payments
  label: Payments
  fieldtype: Table
  options: Cashier Closing Payments
- fieldname: net_amount
  label: Net Amount
  fieldtype: Number
  in_list_view: true
  read_only: true
title_field: user
layout:
- section: Comptabilité et montants
  columns:
  - - naming_series
    - user
    - date
    - from_time
    - time
    - expense
    - custody
    - returns
    - outstanding_amount
    - payments
    - net_amount
views:
  calendar:
    start: date
    title: user
