schema_version: 1
name: Advance Taxes and Charges
label: Advance Taxes and Charges
istable: true
fields:
- fieldname: charge_type
  label: Type
  fieldtype: Select
  options:
  - Actual
  - On Paid Amount
  - On Previous Row Amount
  - On Previous Row Total
  required: true
  in_list_view: true
- fieldname: row_id
  label: 'Reference Row #'
  fieldtype: Text
- fieldname: account_head
  label: Account Head
  fieldtype: Link
  options: Account
  required: true
  in_list_view: true
- fieldname: description
  label: Description
  fieldtype: LongText
  required: true
- fieldname: cost_center
  label: Cost Center
  fieldtype: Link
  options: Cost Center
- fieldname: project
  label: Project
  fieldtype: Link
  options: Project
- fieldname: rate
  label: Tax Rate
  fieldtype: Number
  in_list_view: true
- fieldname: tax_amount
  label: Amount
  fieldtype: Currency
  decimals: 2
  in_list_view: true
- fieldname: total
  label: Total
  fieldtype: Currency
  decimals: 2
  in_list_view: true
  read_only: true
- fieldname: base_tax_amount
  label: Amount (Company Currency)
  fieldtype: Currency
  decimals: 2
  read_only: true
- fieldname: base_total
  label: Total (Company Currency)
  fieldtype: Currency
  decimals: 2
  read_only: true
- fieldname: add_deduct_tax
  label: Add Or Deduct
  fieldtype: Select
  options:
  - Add
  - Deduct
  required: true
- fieldname: included_in_paid_amount
  label: Considered In Paid Amount
  fieldtype: Boolean
  default: false
- fieldname: currency
  label: Account Currency
  fieldtype: Link
  options: Devise
  read_only: true
- fieldname: net_amount
  label: Net Amount
  fieldtype: Currency
  decimals: 2
  in_list_view: true
  read_only: true
- fieldname: base_net_amount
  label: Net Amount (Company Currency)
  fieldtype: Currency
  decimals: 2
  read_only: true
- fieldname: set_by_item_tax_template
  label: Set by Item Tax Template
  fieldtype: Boolean
  read_only: true
  hidden: true
- fieldname: is_tax_withholding_account
  label: Is Tax Withholding Account
  fieldtype: Boolean
  read_only: true
