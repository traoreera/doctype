schema_version: 1
name: Purchase Invoice
label: Purchase Invoice
module: accounts
naming:
  series: PUIN-{YYYY}-{#####}
submittable: true
icon: receipt-text
fields:
- fieldname: title
  label: Title
  fieldtype: Text
- fieldname: naming_series
