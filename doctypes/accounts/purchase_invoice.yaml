- fieldname: is_return
  label: Is Return (Debit Note)
  fieldtype: Boolean
  default: false
- fieldname: apply_tds
  label: Consider for Tax Withholding
  fieldtype: Boolean
  default: false
- fieldname: company
  label: Company
  fieldtype: Link
  options: Company
- fieldname: cost_center
  label: Cost Center
  fieldtype: Link
  options: Cost Center
- fieldname: posting_date
