schema_version: 1
name: Company
label: Company
module: setup
icon: building-complex
fields:
- fieldname: company_name
  label: Company
  fieldtype: Text
  required: true
- fieldname: abbr
  label: Abbr
  fieldtype: Text
  required: true
- fieldname: is_group
  label: Is Group
  fieldtype: Boolean
  in_list_view: true
  default: false
- fieldname: default_finance_book
  label: Default Finance Book
  fieldtype: Link
  options: Finance Book
- fieldname: domain
  label: Domain
  fieldtype: Text
- fieldname: parent_company
  label: Parent Company
  fieldtype: Link
  options: Company
- fieldname: company_logo
  label: Company Logo
  fieldtype: Image
  hidden: true
- fieldname: company_description
  label: Company Description
  fieldtype: TextEditor
- fieldname: sales_monthly_history
  label: Sales Monthly History
  fieldtype: LongText
  read_only: true
  hidden: true
- fieldname: transactions_annual_history
  label: Transactions Annual History
  fieldtype: Code
  read_only: true
  hidden: true
- fieldname: monthly_sales_target
  label: Monthly Sales Target
  fieldtype: Currency
  decimals: 2
- fieldname: total_monthly_sales
  label: Total Monthly Sales
  fieldtype: Currency
  decimals: 2
  read_only: true
- fieldname: default_currency
  label: Default Currency
  fieldtype: Link
  options: Currency
  required: true
  in_list_view: true
- fieldname: default_letter_head
  label: Default Letter Head (DocType)
  fieldtype: Link
  options: Letter Head
- fieldname: default_holiday_list
  label: Default Holiday List
  fieldtype: Link
  options: Holiday List
- fieldname: default_warehouse_for_sales_return
  label: Default Warehouse for Sales Return
  fieldtype: Link
  options: Warehouse
- fieldname: country
  label: Country
  fieldtype: Link
  options: Country
  required: true
  in_list_view: true
- fieldname: create_chart_of_accounts_based_on
  label: Create Chart Of Accounts Based On
  fieldtype: Select
  options:
  - Standard Template
  - Existing Company
- fieldname: existing_company
  label: 'Existing Company '
  fieldtype: Link
  options: Company
- fieldname: tax_id
  label: Tax ID
  fieldtype: Text
- fieldname: date_of_establishment
  label: Date of Establishment
  fieldtype: Date
- fieldname: default_bank_account
  label: Default Bank Account
  fieldtype: Link
  options: Account
- fieldname: default_cash_account
  label: Default Cash Account
  fieldtype: Link
  options: Account
- fieldname: default_receivable_account
  label: Default Receivable Account
  fieldtype: Link
  options: Account
- fieldname: round_off_account
  label: Round Off Account
  fieldtype: Link
  options: Account
- fieldname: round_off_cost_center
  label: Round Off Cost Center
  fieldtype: Link
  options: Cost Center
- fieldname: write_off_account
  label: Write Off Account
  fieldtype: Link
  options: Account
- fieldname: bank_charges_account
  label: Bank Charges Account
  fieldtype: Link
  options: Account
- fieldname: exchange_gain_loss_account
  label: Exchange Gain / Loss Account
  fieldtype: Link
  options: Account
- fieldname: exchange_gain_account
  label: Exchange Gain Account
  fieldtype: Link
  options: Account
- fieldname: exchange_loss_account
  label: Exchange Loss Account
  fieldtype: Link
  options: Account
- fieldname: unrealized_exchange_gain_loss_account
  label: Unrealized Exchange Gain/Loss Account
  fieldtype: Link
  options: Account
- fieldname: allow_account_creation_against_child_company
  label: Allow Account Creation Against Child Company
  fieldtype: Boolean
  default: false
- fieldname: default_payable_account
  label: Default Payable Account
  fieldtype: Link
  options: Account
- fieldname: default_expense_account
  label: Default Cost of Goods Sold Account
  fieldtype: Link
  options: Account
- fieldname: default_income_account
  label: Default Income Account
  fieldtype: Link
  options: Account
- fieldname: default_deferred_revenue_account
  label: Default Deferred Revenue Account
  fieldtype: Link
  options: Account
- fieldname: default_deferred_expense_account
  label: Default Deferred Expense Account
  fieldtype: Link
  options: Account
- fieldname: cost_center
  label: Default Cost Center
  fieldtype: Link
  options: Cost Center
- fieldname: credit_limit
  label: Credit Limit
  fieldtype: Currency
  decimals: 2
- fieldname: payment_terms
  label: Default Payment Terms Template
  fieldtype: Link
  options: Payment Terms Template
- fieldname: enable_perpetual_inventory
  label: Enable Perpetual Inventory
  fieldtype: Boolean
  in_list_view: true
  default: true
- fieldname: default_inventory_account
  label: Default Inventory Account
  fieldtype: Link
  options: Account
- fieldname: stock_adjustment_account
  label: Stock Adjustment Account
  fieldtype: Link
  options: Account
- fieldname: default_purchase_price_variance_account
  label: Default Purchase Price Variance Account
  fieldtype: Link
  options: Account
  description: 'Used for items valued at Standard Cost: the difference between the purchase price and the standard
    rate is booked here.'
- fieldname: default_manufacturing_variance_account
  label: Default Manufacturing Variance Account
  fieldtype: Link
  options: Account
  description: 'For Standard Cost items: the Manufacture/Repack consumed cost vs standard rate difference is booked
    here.'
- fieldname: stock_received_but_not_billed
  label: Stock Received But Not Billed
  fieldtype: Link
  options: Account
- fieldname: accumulated_depreciation_account
  label: Accumulated Depreciation Account
  fieldtype: Link
  options: Account
- fieldname: depreciation_expense_account
  label: Depreciation Expense Account
  fieldtype: Link
  options: Account
- fieldname: series_for_depreciation_entry
  label: Series for Asset Depreciation Entry (Journal Entry)
  fieldtype: Text
- fieldname: disposal_account
  label: Gain/Loss Account on Asset Disposal
  fieldtype: Link
  options: Account
- fieldname: depreciation_cost_center
  label: Asset Depreciation Cost Center
  fieldtype: Link
  options: Cost Center
- fieldname: capital_work_in_progress_account
  label: Capital Work In Progress Account
  fieldtype: Link
  options: Account
- fieldname: asset_received_but_not_billed
  label: Asset Received But Not Billed
  fieldtype: Link
  options: Account
- fieldname: date_of_incorporation
  label: Date of Incorporation
  fieldtype: Date
- fieldname: date_of_commencement
  label: Date of Commencement
  fieldtype: Date
- fieldname: phone_no
  label: Phone No
  fieldtype: Text
- fieldname: fax
  label: Fax
  fieldtype: Text
- fieldname: email
  label: Email
  fieldtype: Text
- fieldname: website
  label: Website
  fieldtype: Text
- fieldname: registration_details
  label: Registration Details
  fieldtype: Code
  description: Company registration numbers for your reference. Tax numbers etc.
- fieldname: lft
  label: Lft
  fieldtype: Int
  read_only: true
  hidden: true
- fieldname: rgt
  label: Rgt
  fieldtype: Int
  read_only: true
  hidden: true
- fieldname: old_parent
  label: old_parent
  fieldtype: Text
  read_only: true
  hidden: true
- fieldname: default_selling_terms
  label: Default Selling Terms
  fieldtype: Link
  options: Terms and Conditions
- fieldname: default_buying_terms
  label: Default Buying Terms
  fieldtype: Link
  options: Terms and Conditions
- fieldname: default_in_transit_warehouse
  label: Default In-Transit Warehouse
  fieldtype: Link
  options: Warehouse
- fieldname: default_warehouse
  label: Default Warehouse
  fieldtype: Link
  options: Warehouse
- fieldname: sample_retention_warehouse
  label: Sample Retention Warehouse
  fieldtype: Link
  options: Warehouse
- fieldname: unrealized_profit_loss_account
  label: Unrealized Profit / Loss Account
  fieldtype: Link
  options: Account
- fieldname: default_discount_account
  label: Default Payment Discount Account
  fieldtype: Link
  options: Account
- fieldname: enable_provisional_accounting_for_non_stock_items
  label: Enable Provisional Accounting For Non Stock Items
  fieldtype: Boolean
  default: false
- fieldname: default_provisional_account
  label: Default Provisional Account
  fieldtype: Link
  options: Account
- fieldname: default_advance_received_account
  label: Default Advance Received Account
  fieldtype: Link
  options: Account
  description: Only 'Payment Entries' made against this advance account are supported.
- fieldname: default_advance_paid_account
  label: Default Advance Paid Account
  fieldtype: Link
  options: Account
  description: Only 'Payment Entries' made against this advance account are supported.
- fieldname: book_advance_payments_in_separate_party_account
  label: Book Advance Payments in Separate Party Account
  fieldtype: Boolean
  description: Enabling this option will allow you to record - <br><br> 1. Advances Received in a <b>Liability Account</b>
    instead of the <b>Asset Account</b><br><br>2. Advances Paid in an <b>Asset Account</b> instead of the <b> Liability
    Account</b>
  default: false
- fieldname: auto_exchange_rate_revaluation
  label: Auto Create Exchange Rate Revaluation
  fieldtype: Boolean
  default: false
- fieldname: auto_err_frequency
  label: Frequency
  fieldtype: Select
  options:
  - Daily
  - Weekly
  - Monthly
- fieldname: submit_err_jv
  label: Submit ERR Journals?
  fieldtype: Boolean
  description: Upon enabling this, the JV will be submitted for a different exchange rate.
  default: false
- fieldname: reconcile_on_advance_payment_date
  label: Reconcile on Advance Payment Date
  fieldtype: Boolean
  hidden: true
  description: 'If <b>Enabled</b> - Reconciliation happens on the <b>Advance Payment posting date</b><br>

    If <b>Disabled</b> - Reconciliation happens on oldest of 2 Dates: <b>Invoice Date</b> or the <b>Advance Payment
    posting date</b><br>'
  default: false
- fieldname: default_operating_cost_account
  label: Default Operating Cost Account
  fieldtype: Link
  options: Account
- fieldname: round_off_for_opening
  label: Round Off for Opening
  fieldtype: Link
  options: Account
- fieldname: reconciliation_takes_effect_on
  label: Reconciliation Takes Effect On
  fieldtype: Select
  options:
  - Advance Payment Date
  - Oldest Of Invoice Or Advance
  - Reconciliation Date
  default: Oldest Of Invoice Or Advance
- fieldname: reporting_currency
  label: Reporting Currency
  fieldtype: Link
  options: Currency
  read_only: true
- fieldname: purchase_expense_account
  label: Purchase Expense Account
  fieldtype: Link
  options: Account
- fieldname: purchase_expense_contra_account
  label: Purchase Expense Contra Account
  fieldtype: Link
  options: Account
- fieldname: service_expense_account
  label: Service Expense Account
  fieldtype: Link
  options: Account
  description: For service item
- fieldname: expenses_added_to_stock_account
  label: Expenses Added To Stock Account
  fieldtype: Link
  options: Account
- fieldname: expenses_added_to_stock_contra_account
  label: Expenses Added To Stock Contra Account
  fieldtype: Link
  options: Account
- fieldname: enable_item_wise_inventory_account
  label: Enable Item-wise Inventory Account
  fieldtype: Boolean
  description: If enabled, the system will use the inventory account set in the Item Master or Item Group or Brand.
    Otherwise, it will use the inventory account set in the Warehouse.
  default: false
- fieldname: valuation_method
  label: Default Stock Valuation Method
  fieldtype: Select
  options:
  - FIFO
  - Moving Average
  - LIFO
  default: FIFO
  required: true
- fieldname: default_wip_warehouse
  label: ' Default Work In Progress Warehouse '
  fieldtype: Link
  options: Warehouse
- fieldname: default_fg_warehouse
  label: Default Finished Goods Warehouse
  fieldtype: Link
  options: Warehouse
- fieldname: default_scrap_warehouse
  label: Default Scrap Warehouse
  fieldtype: Link
  options: Warehouse
- fieldname: default_sales_contact
  label: Default Sales Contact
  fieldtype: Link
  options: Contact
- fieldname: accounts_frozen_till_date
  label: Accounts Frozen Till Date
  fieldtype: Date
  description: Accounting entries are frozen up to this date. Only users with the specified role can create or modify
    entries before this date.
- fieldname: default_letter_head_report
  label: Default Letter Head (Report)
  fieldtype: Link
  options: Letter Head
- fieldname: disable_sdbnb_in_sr
  label: Disable Stock Delivered But Not Billed in Sales Return
  fieldtype: Boolean
  default: false
- fieldname: stock_delivered_but_not_billed
  label: Stock Delivered But Not Billed
  fieldtype: Link
  options: Account
- fieldname: enable_stock_delivered_but_not_billed
  label: Enable Stock Delivered But Not Billed
  fieldtype: Boolean
  description: If enabled, the value of goods delivered before invoicing will be recorded in the Stock Delivered
    But Not Billed account.
  default: false
title_field: company_name
layout:
- tab: Général
  section: Comptabilité et montants
  columns:
  - - company_name
    - abbr
    - default_currency
    - country
    - is_group
    - default_holiday_list
  - - tax_id
    - domain
    - date_of_establishment
    - parent_company
    - reporting_currency
- tab: Général
  section: Références
  columns:
  - - default_letter_head
  - - default_letter_head_report
- tab: Général
  section: Address & Contact
  columns:
  - - date_of_incorporation
    - phone_no
    - email
    - company_description
  - - date_of_commencement
    - fax
    - website
- tab: Général
  section: Détails
  columns:
  - - registration_details
- tab: Accounts
  section: Chart of Accounts
  columns:
  - - create_chart_of_accounts_based_on
    - existing_company
- tab: Accounts
  section: Default Accounts
  columns:
  - - default_bank_account
    - default_cash_account
    - default_receivable_account
    - default_payable_account
    - write_off_account
    - bank_charges_account
    - unrealized_profit_loss_account
  - - allow_account_creation_against_child_company
    - default_expense_account
    - default_income_account
    - default_discount_account
    - payment_terms
    - cost_center
    - default_finance_book
- tab: Accounts
  section: Exchange Gain / Loss
  columns:
  - - exchange_gain_loss_account
    - exchange_gain_account
    - exchange_loss_account
  - - unrealized_exchange_gain_loss_account
- tab: Accounts
  section: Round Off
  columns:
  - - round_off_account
    - round_off_cost_center
  - - round_off_for_opening
- tab: Accounts
  section: Deferred Accounting
  columns:
  - - default_deferred_revenue_account
  - - default_deferred_expense_account
- tab: Accounts
  section: Advance Payments
  columns:
  - - book_advance_payments_in_separate_party_account
    - reconciliation_takes_effect_on
  - - default_advance_received_account
    - default_advance_paid_account
- tab: Accounts
  section: Exchange Rate Revaluation Settings
  columns:
  - - auto_exchange_rate_revaluation
    - auto_err_frequency
    - submit_err_jv
- tab: Accounts
  section: Fixed Asset Defaults
  columns:
  - - accumulated_depreciation_account
    - depreciation_expense_account
    - series_for_depreciation_entry
  - - disposal_account
    - depreciation_cost_center
    - capital_work_in_progress_account
    - asset_received_but_not_billed
- tab: Accounts Closing
  section: Comptabilité et montants
  columns:
  - - accounts_frozen_till_date
- tab: Buying and Selling
  section: Buying & Selling Settings
  columns:
  - - default_buying_terms
    - monthly_sales_target
    - total_monthly_sales
  - - default_selling_terms
    - default_sales_contact
    - credit_limit
- tab: Buying and Selling
  section: Purchase Expense
  columns:
  - - purchase_expense_account
    - service_expense_account
  - - purchase_expense_contra_account
- tab: Buying and Selling
  section: Stock Expense
  columns:
  - - expenses_added_to_stock_account
  - - expenses_added_to_stock_contra_account
- tab: Stock and Manufacturing
  section: Stock Settings
  columns:
  - - enable_perpetual_inventory
    - enable_item_wise_inventory_account
    - enable_provisional_accounting_for_non_stock_items
    - default_inventory_account
    - valuation_method
  - - stock_adjustment_account
    - default_purchase_price_variance_account
    - default_manufacturing_variance_account
    - stock_received_but_not_billed
    - enable_stock_delivered_but_not_billed
    - stock_delivered_but_not_billed
    - disable_sdbnb_in_sr
    - default_provisional_account
- tab: Stock and Manufacturing
  section: Manufacturing
  columns:
  - - default_operating_cost_account
- tab: Stock and Manufacturing
  section: Warehouse Defaults
  columns:
  - - default_warehouse
    - sample_retention_warehouse
    - default_in_transit_warehouse
  - - default_warehouse_for_sales_return
    - default_wip_warehouse
    - default_fg_warehouse
    - default_scrap_warehouse
views:
  tree:
    parent: parent_company
