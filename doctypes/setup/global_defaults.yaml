schema_version: 1
name: Global Defaults
label: Global Defaults
module: setup
icon: settings
fields:
- fieldname: default_company
  label: Default Company
  fieldtype: Link
  options: Company
- fieldname: country
  label: Default Country
  fieldtype: Link
  options: Country
- fieldname: default_distance_unit
  label: Default Distance Unit
  fieldtype: Link
  options: UOM
- fieldname: default_currency
  label: Default Currency
  fieldtype: Link
  options: Currency
  required: true
  in_list_view: true
- fieldname: hide_currency_symbol
  label: Hide Currency Symbol
  fieldtype: Boolean
  in_list_view: true
  description: Do not show any symbol like $ etc next to currencies.
  default: false
- fieldname: disable_rounded_total
  label: Disable Rounded Total
  fieldtype: Boolean
  in_list_view: true
  description: If disable, 'Rounded Total' field will not be visible in any transaction
  default: false
- fieldname: disable_in_words
  label: Disable In Words
  fieldtype: Boolean
  in_list_view: true
  description: If disable, 'In Words' field will not be visible in any transaction
  default: false
- fieldname: demo_company
  label: Demo Company
  fieldtype: Link
  options: Company
  read_only: true
  hidden: true
- fieldname: use_posting_datetime_for_naming_documents
  label: Use Posting Date for Naming Documents
  fieldtype: Boolean
  description: When checked, the system will use the posting date of the document for naming instead of the creation
    date.
  default: true
- fieldname: enable_item_search_index
  label: Enable Item Search Index
  fieldtype: Boolean
  description: 'Speeds up Item search on large catalogues. Requires a single app server: the index is a file on
    that server''s disk, and several servers would each answer from a different copy. Building it takes about 20
    minutes for 3 million items, and runs in the background.'
  default: false
title_field: default_currency
layout:
- section: Defaults
  columns:
  - - default_company
    - country
  - - default_currency
    - default_distance_unit
- section: General Settings
  columns:
  - - hide_currency_symbol
    - disable_rounded_total
    - disable_in_words
  - - use_posting_datetime_for_naming_documents
    - enable_item_search_index
