schema_version: 1
name: Job Card Secondary Item
label: Job Card Secondary Item
istable: true
fields:
- fieldname: item_code
  label: Secondary Item Code
  fieldtype: Link
  options: Item
  required: true
  in_list_view: true
- fieldname: item_name
  label: Secondary Item Name
  fieldtype: Text
  in_list_view: true
  fetch_from: item_code.item_name
- fieldname: description
  label: Description
  fieldtype: LongText
  read_only: true
- fieldname: stock_qty
  label: Qty
  fieldtype: Decimal
  decimals: 3
  required: true
  in_list_view: true
- fieldname: stock_uom
  label: Stock UOM
  fieldtype: Link
  options: UOM
  read_only: true
- fieldname: secondary_item_type
  label: Type
  fieldtype: Select
  options:
  - Co-Product
  - By-Product
  - Scrap
  - Additional Finished Good
  required: true
  in_list_view: true
- fieldname: bom_secondary_item
  label: BOM Secondary Item Reference
  fieldtype: Text
  read_only: true
  hidden: true
