schema_version: 1
name: Blanket Order
label: Blanket Order
module: manufacturing
submittable: true
icon: file-text
fields:
- fieldname: naming_series
  label: Series
  fieldtype: Select
  options:
  - MFG-BLR-.YYYY.-
  required: true
- fieldname: blanket_order_type
  label: Order Type
  fieldtype: Select
  options:
  - Selling
  - Purchasing
  required: true
  in_list_view: true
- fieldname: customer
  label: Customer
  fieldtype: Link
  options: Customer
- fieldname: customer_name
  label: Customer Name
  fieldtype: Text
  read_only: true
- fieldname: supplier
  label: Supplier
  fieldtype: Link
  options: Supplier
- fieldname: supplier_name
  label: Supplier Name
  fieldtype: Text
  read_only: true
- fieldname: from_date
  label: From Date
  fieldtype: Date
  required: true
- fieldname: to_date
  label: To Date
  fieldtype: Date
  required: true
- fieldname: company
  label: Company
  fieldtype: Link
  options: Company
  required: true
- fieldname: status
  label: Status
  fieldtype: Select
  options:
  - Draft
  - Submitted
  - Closed
  - Cancelled
  default: Draft
  read_only: true
- fieldname: currency
  label: Currency
  fieldtype: Link
  options: Devise
  required: true
- fieldname: conversion_rate
  label: Exchange Rate
  fieldtype: Number
  required: true
  description: Rate at which document currency is converted to company currency
- fieldname: selling_price_list
  label: Price List
  fieldtype: Link
  options: Price List
- fieldname: buying_price_list
  label: Price List
  fieldtype: Link
  options: Price List
- fieldname: price_list_currency
  label: Price List Currency
  fieldtype: Link
  options: Devise
  read_only: true
- fieldname: plc_conversion_rate
  label: Price List Exchange Rate
  fieldtype: Number
  description: Rate at which Price List Currency is converted to Company Currency
- fieldname: items
  label: Item
  fieldtype: Table
  options: Blanket Order Item
- fieldname: amended_from
  label: Amended From
  fieldtype: Link
  options: Blanket Order
  read_only: true
- fieldname: tc_name
  label: Terms
  fieldtype: Link
  options: Terms and Conditions
- fieldname: terms
  label: Terms and Conditions Details
  fieldtype: TextEditor
- fieldname: order_no
  label: Order No
  fieldtype: Text
- fieldname: order_date
  label: Order Date
  fieldtype: Date
title_field: customer
layout:
- section: Dates et planification
  columns:
  - - naming_series
    - blanket_order_type
    - customer
    - customer_name
    - supplier
    - supplier_name
  - - order_no
    - order_date
    - from_date
    - to_date
    - company
    - status
- section: Currency and Price List
  columns:
  - - currency
    - conversion_rate
  - - selling_price_list
    - buying_price_list
    - price_list_currency
    - plc_conversion_rate
- section: Dates et planification
  columns:
  - - items
    - amended_from
- section: Terms and Conditions
  columns:
  - - tc_name
    - terms
views:
  calendar:
    start: from_date
    title: customer
  gantt:
    start: from_date
    end: to_date
    title: customer
  tree:
    parent: amended_from
