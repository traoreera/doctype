schema_version: 1
name: Job Card Item
label: Job Card Item
istable: true
fields:
- fieldname: item_code
  label: Item Code
  fieldtype: Link
  options: Item
  required: true
  in_list_view: true
- fieldname: source_warehouse
  label: Source Warehouse
  fieldtype: Link
  options: Warehouse
  in_list_view: true
- fieldname: uom
  label: UOM
  fieldtype: Link
  options: UOM
- fieldname: item_name
  label: Item Name
  fieldtype: Text
  read_only: true
  fetch_from: item_code.item_name
- fieldname: description
  label: Description
  fieldtype: TextEditor
  read_only: true
- fieldname: required_qty
  label: Required Qty
  fieldtype: Decimal
  decimals: 3
  in_list_view: true
- fieldname: allow_alternative_item
  label: Allow Alternative Item
  fieldtype: Boolean
  default: false
- fieldname: item_group
  label: Item Group
  fieldtype: Link
  options: Item Group
  read_only: true
- fieldname: stock_uom
  label: Stock UOM
  fieldtype: Link
  options: UOM
- fieldname: transferred_qty
  label: Transferred Qty
  fieldtype: Decimal
  decimals: 3
  read_only: true
- fieldname: consumed_qty
  label: Consumed Qty
  fieldtype: Decimal
  decimals: 3
  read_only: true
