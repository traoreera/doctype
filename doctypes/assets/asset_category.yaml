schema_version: 1
name: Asset Category
label: Asset Category
module: assets
icon: folder
fields:
- fieldname: asset_category_name
  label: Asset Category Name
  fieldtype: Text
  required: true
  in_list_view: true
- fieldname: finance_books
  label: Finance Books
  fieldtype: Table
  options: Asset Finance Book
- fieldname: accounts
  label: Accounts
  fieldtype: Table
  options: Asset Category Account
- fieldname: enable_cwip_accounting
