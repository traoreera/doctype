schema_version: 1
name: Salary Component
label: Salary Component
module: payroll
icon: puzzle
fields:
- fieldname: salary_component
  label: Name
  fieldtype: Text
  required: true
  in_list_view: true
- fieldname: salary_component_abbr
  label: Abbr
  fieldtype: Text
  required: true
  in_list_view: true
- fieldname: type
  label: Type
  fieldtype: Select
  options:
  - Earning
  - Deduction
  - Employer Contribution
  required: true
- fieldname: is_tax_applicable
  label: Is Tax Applicable
  fieldtype: Boolean
  default: true
- fieldname: depends_on_payment_days
  label: Depends on Payment Days
  fieldtype: Boolean
  default: true
- fieldname: do_not_include_in_total
  label: Do Not Include in Total
  fieldtype: Boolean
  default: false
- fieldname: deduct_full_tax_on_selected_payroll_date
  label: Deduct Full Tax on Selected Payroll Date
  fieldtype: Boolean
  default: false
- fieldname: disabled
  label: Disabled
  fieldtype: Boolean
  default: false
- fieldname: description
  label: Description
  fieldtype: LongText
  in_list_view: true
- fieldname: statistical_component
  label: Statistical Component
  fieldtype: Boolean
  description: If enabled, the value specified or calculated in this component will not contribute to the earnings
    or deductions. However, it's value can be referenced by other components that can be added or deducted.
  default: false
- fieldname: is_flexible_benefit
  label: Is Flexible Benefit
  fieldtype: Boolean
  default: false
- fieldname: max_benefit_amount
  label: Max Benefit Amount (Yearly)
  fieldtype: Currency
  decimals: 2
  description: If greater than zero, this sets the maximum benefit amount assignable to any employee
- fieldname: variable_based_on_taxable_salary
  label: Variable Based On Taxable Salary
  fieldtype: Boolean
  description: If enabled, the component will be considered as a tax component and the amount will be auto-calculated
    as per the configured income tax slabs
  default: false
- fieldname: accounts
  label: Accounts
  fieldtype: Table
  options: Salary Component Account
- fieldname: condition
  label: Condition
  fieldtype: Code
- fieldname: amount_based_on_formula
  label: Amount based on formula
  fieldtype: Boolean
  default: false
- fieldname: formula
  label: Formula
  fieldtype: Code
- fieldname: amount
  label: Amount
  fieldtype: Currency
  decimals: 2
- fieldname: round_to_the_nearest_integer
  label: Round to the Nearest Integer
  fieldtype: Boolean
  default: false
- fieldname: exempted_from_income_tax
  label: Exempted from Income Tax
  fieldtype: Boolean
  description: If checked, the full amount will be deducted from taxable income before calculating income tax without
    any declaration or proof submission.
  default: false
- fieldname: is_income_tax_component
  label: Is Income Tax Component
  fieldtype: Boolean
  description: If enabled, the component will be considered in the Income Tax Deductions report
  default: false
- fieldname: remove_if_zero_valued
  label: Remove if Zero Valued
  fieldtype: Boolean
  description: If enabled, the component will not be displayed in the salary slip if the amount is zero
  default: true
- fieldname: do_not_include_in_accounts
  label: Do Not Include in Accounting Entries
  fieldtype: Boolean
  description: If enabled, the amount will be excluded from accounting entries during Journal Entry creation.
  default: false
- fieldname: arrear_component
  label: Arrear Component
  fieldtype: Boolean
  description: If enabled, this component will be included in arrear calculations
  default: false
- fieldname: accrual_component
  label: Accrual Component
  fieldtype: Boolean
  description: If enabled, this component allows to accrue amounts without adding them to earnings. The accrued
    balance is tracked in the Employee Benefit Ledger and can be paid out later as needed.
  default: false
- fieldname: payout_method
  label: Payout Method
  fieldtype: Select
  options:
  - Accrue and payout at end of payroll period
  - Accrue per cycle, pay only on claim
  - Allow claim for full benefit amount
- fieldname: final_cycle_accrual_payout
  label: Payout Unclaimed Amount in Final Payroll Cycle
  fieldtype: Boolean
  default: false
title_field: salary_component
layout:
- tab: Overview
  section: Informations principales
  columns:
  - - salary_component
    - salary_component_abbr
    - type
    - description
  - - depends_on_payment_days
    - is_tax_applicable
    - deduct_full_tax_on_selected_payroll_date
    - variable_based_on_taxable_salary
    - is_income_tax_component
    - exempted_from_income_tax
    - round_to_the_nearest_integer
    - statistical_component
    - accrual_component
    - do_not_include_in_total
    - do_not_include_in_accounts
    - remove_if_zero_valued
    - arrear_component
    - disabled
- tab: Overview
  section: Accounts
  columns:
  - - accounts
- tab: Condition & Formula
  section: Informations complémentaires 3
  columns:
  - - condition
    - amount
    - amount_based_on_formula
    - formula
- tab: Flexible Benefits
  section: Informations complémentaires 4
  columns:
  - - is_flexible_benefit
    - payout_method
    - final_cycle_accrual_payout
  - - max_benefit_amount
