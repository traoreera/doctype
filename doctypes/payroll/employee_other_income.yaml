schema_version: 1
name: Employee Other Income
label: Employee Other Income
module: payroll
naming:
  series: EOI-{YYYY}-{#####}
submittable: true
icon: coins
fields:
- fieldname: employee
  label: Employee
  fieldtype: Link
  options: Employee
  required: true
  in_list_view: true
- fieldname: payroll_period
  label: Payroll Period
  fieldtype: Link
  options: Payroll Period
  required: true
  in_list_view: true
- fieldname: company
  label: Company
  fieldtype: Link
  options: Company
  required: true
  in_list_view: true
- fieldname: source
  label: Source
  fieldtype: Text
- fieldname: amount
  label: Amount
  fieldtype: Currency
  decimals: 2
