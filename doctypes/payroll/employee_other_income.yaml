  in_list_view: true
- fieldname: employee_name
  label: Employee Name
  fieldtype: Text
  read_only: true
  fetch_from: employee.employee_name
title_field: employee_name
layout:
- section: Employee Details
  columns:
  - - employee
    - employee_name
  - - company
    - payroll_period
- section: Income Source
  columns:
