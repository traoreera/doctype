  - { type: header, text: Personnel et organisation }
  - { type: shortcut, doctype: Employee, new: true }
  - { type: shortcut, doctype: Department, new: true }
  - { type: shortcut, doctype: Employee Checkin, new: true }
  - { type: shortcut, doctype: Attendance, new: true }
  - { type: shortcut, doctype: Shift Assignment, new: true }
  - { type: header, text: Congés et paramètres }
