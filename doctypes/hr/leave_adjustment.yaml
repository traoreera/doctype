schema_version: 1
name: Leave Adjustment
label: Leave Adjustment
module: hr
naming:
  series: LA-{YYYY}-{#####}
submittable: true
icon: sliders-horizontal
fields:
- fieldname: employee
  label: Employee
  fieldtype: Link
  options: Employee
  required: true
- fieldname: employee_name
  label: Employee Name
  fieldtype: Text
  read_only: true
  fetch_from: employee.employee_name
- fieldname: leave_type
  label: Leave Type
  fieldtype: Link
  options: Leave Type
  required: true
- fieldname: leave_allocation
  label: Allocation to Adjust
  fieldtype: Link
  options: Leave Allocation
  required: true
  read_only: true
- fieldname: from_date
  label: From Date
  fieldtype: Date
  read_only: true
- fieldname: naming_series
  label: Series
  fieldtype: Select
  options:
  - HR-LAD-.YYYY.-
  required: true
  in_list_view: true
- fieldname: to_date
  label: To Date
  fieldtype: Date
  read_only: true
- fieldname: allocated_leaves
  label: Allocated Leaves
  fieldtype: Number
  read_only: true
- fieldname: posting_date
  label: Posting Date
  fieldtype: Date
  required: true
  default: today
- fieldname: leaves_to_adjust
  label: Leaves to Adjust
  fieldtype: Number
  required: true
- fieldname: adjustment_type
  label: Adjustment Type
  fieldtype: Select
  options:
  - Allocate
  - Reduce
  required: true
- fieldname: leaves_after_adjustment
  label: Leaves After Adjustment
  fieldtype: Number
  read_only: true
- fieldname: reason_for_adjustment
  label: Reason for Adjustment
  fieldtype: LongText
- fieldname: company
  label: Company
  fieldtype: Link
  options: Company
  read_only: true
title_field: employee_name
layout:
- section: Informations principales
  columns:
  - - naming_series
    - employee
    - employee_name
    - company
  - - leave_type
    - adjustment_type
    - leaves_to_adjust
    - posting_date
- section: Allocation Details
  columns:
  - - leave_allocation
    - allocated_leaves
    - leaves_after_adjustment
  - - from_date
    - to_date
- section: Informations complémentaires 3
  columns:
  - - reason_for_adjustment
views:
  calendar:
    start: posting_date
    title: employee_name
  gantt:
    start: from_date
    end: to_date
    title: employee_name
