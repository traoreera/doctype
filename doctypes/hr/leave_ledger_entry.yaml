schema_version: 1
name: Leave Ledger Entry
label: Leave Ledger Entry
module: hr
naming:
  series: LLE-{YYYY}-{#####}
submittable: true
icon: book-open
fields:
- fieldname: employee
  label: Employee
  fieldtype: Link
  options: Employee
  in_list_view: true
- fieldname: employee_name
  label: Employee Name
  fieldtype: Text
- fieldname: leave_type
  label: Leave Type
  fieldtype: Link
  options: Leave Type
  in_list_view: true
- fieldname: transaction_type
  label: Transaction Type
  fieldtype: Text
- fieldname: transaction_name
  label: Transaction Name
  fieldtype: DynamicLink
  options: transaction_type
- fieldname: leaves
  label: Leaves
  fieldtype: Number
  in_list_view: true
- fieldname: from_date
  label: From Date
  fieldtype: Date
- fieldname: to_date
  label: To Date
  fieldtype: Date
- fieldname: is_carry_forward
  label: Is Carry Forward
  fieldtype: Boolean
  default: false
- fieldname: is_expired
  label: Is Expired
  fieldtype: Boolean
  default: false
- fieldname: is_lwp
  label: Is Leave Without Pay
  fieldtype: Boolean
  default: false
- fieldname: holiday_list
  label: Holiday List
  fieldtype: Link
  options: Holiday List
- fieldname: company
  label: Company
  fieldtype: Link
  options: Company
  required: true
  read_only: true
title_field: employee_name
layout:
- section: Informations principales
  columns:
  - - employee
    - employee_name
    - leave_type
    - transaction_type
    - transaction_name
    - company
    - leaves
  - - from_date
    - to_date
    - holiday_list
    - is_carry_forward
    - is_expired
    - is_lwp
views:
  calendar:
    start: from_date
    title: employee_name
  gantt:
    start: from_date
    end: to_date
    title: employee_name
permissions:
  write: []
  create: []
  delete: []
  submit: []
  cancel: []
