schema_version: 1
name: Shift Request
label: Shift Request
module: hr
naming:
  series: SR-{YYYY}-{#####}
submittable: true
icon: calendar-clock
fields:
- fieldname: shift_type
  label: Shift Type
  fieldtype: Link
  options: Shift Type
  required: true
  in_list_view: true
- fieldname: employee
  label: Employee
  fieldtype: Link
  options: Employee
  required: true
  in_list_view: true
- fieldname: employee_name
  label: Employee Name
  fieldtype: Text
  read_only: true
- fieldname: department
  label: Department
  fieldtype: Link
  options: Department
  read_only: true
- fieldname: company
  label: Company
  fieldtype: Link
  options: Company
  required: true
  in_list_view: true
- fieldname: from_date
  label: From Date
  fieldtype: Date
  required: true
- fieldname: to_date
  label: To Date
  fieldtype: Date
- fieldname: status
  label: Status
  fieldtype: Select
  options:
  - Draft
  - Approved
  - Rejected
  default: Draft
  required: true
- fieldname: approver
  label: Approver
  fieldtype: Text
  required: true
  format: email
title_field: employee_name
layout:
- section: Informations principales
  columns:
  - - shift_type
    - employee
    - employee_name
    - department
    - status
  - - company
    - approver
    - from_date
    - to_date
views:
  kanban:
    field: status
    card_fields:
    - employee_name
    - employee
    - from_date
  calendar:
    start: from_date
    title: employee_name
    color: status
  gantt:
    start: from_date
    end: to_date
    title: employee_name
    color: status
