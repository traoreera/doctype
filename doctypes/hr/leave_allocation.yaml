schema_version: 1
name: Leave Allocation
label: Leave Allocation
module: hr
naming:
  series: LEAL-{YYYY}-{#####}
submittable: true
icon: calendar-range
fields:
- fieldname: naming_series
  label: Series
  fieldtype: Select
  options:
  - HR-LAL-.YYYY.-
  required: true
- fieldname: employee
  label: Employee
  fieldtype: Link
  options: Employee
  required: true
  in_list_view: true
- fieldname: employee_name
  label: Employee Name
  fieldtype: Text
  in_list_view: true
  read_only: true
- fieldname: department
  label: Department
  fieldtype: Link
  options: Department
  read_only: true
- fieldname: leave_type
  label: Leave Type
  fieldtype: Link
  options: Leave Type
  required: true
  in_list_view: true
- fieldname: from_date
  label: From Date
  fieldtype: Date
  required: true
- fieldname: to_date
  label: To Date
  fieldtype: Date
  required: true
- fieldname: new_leaves_allocated
  label: New Leaves Allocated
  fieldtype: Number
- fieldname: carry_forward
  label: Add unused leaves from previous allocations
  fieldtype: Boolean
  default: false
- fieldname: unused_leaves
  label: Unused leaves
  fieldtype: Number
  read_only: true
- fieldname: total_leaves_allocated
  label: Total Leaves Allocated
  fieldtype: Number
  required: true
  read_only: true
- fieldname: total_leaves_encashed
  label: Total Leaves Encashed
  fieldtype: Number
  read_only: true
- fieldname: compensatory_request
  label: Compensatory Leave Request
  fieldtype: Link
  options: Compensatory Leave Request
  read_only: true
- fieldname: leave_period
  label: Leave Period
  fieldtype: Link
  options: Leave Period
  read_only: true
- fieldname: leave_policy
  label: Leave Policy
  fieldtype: Link
  options: Leave Policy
  read_only: true
  hidden: true
- fieldname: expired
  label: Expired
  fieldtype: Boolean
  read_only: true
  hidden: true
- fieldname: description
  label: Description
  fieldtype: LongText
- fieldname: carry_forwarded_leaves_count
  label: Carry Forwarded Leaves
  fieldtype: Number
  read_only: true
- fieldname: leave_policy_assignment
  label: Leave Policy Assignment
  fieldtype: Link
  options: Leave Policy Assignment
  read_only: true
- fieldname: company
  label: Company
  fieldtype: Link
  options: Company
  required: true
  read_only: true
- fieldname: earned_leave_schedule
  label: Earned Leave Schedule
  fieldtype: Table
  options: Earned Leave Schedule
  read_only: true
title_field: employee_name
layout:
- section: Informations principales
  columns:
  - - naming_series
    - employee
    - employee_name
    - department
    - company
  - - leave_type
    - from_date
    - to_date
- section: Allocation
  columns:
  - - new_leaves_allocated
    - carry_forward
    - unused_leaves
    - total_leaves_allocated
    - total_leaves_encashed
  - - compensatory_request
    - leave_period
    - leave_policy_assignment
    - carry_forwarded_leaves_count
- section: Earned Leave Schedule
  columns:
  - - earned_leave_schedule
- section: Notes
  columns:
  - - description
views:
  calendar:
    start: from_date
    title: employee_name
  gantt:
    start: from_date
    end: to_date
    title: employee_name
