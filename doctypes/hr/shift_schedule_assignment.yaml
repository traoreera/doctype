schema_version: 1
name: Shift Schedule Assignment
label: Shift Schedule Assignment
module: hr
icon: calendar-check-2
fields:
- fieldname: enabled
  label: Enabled
  fieldtype: Boolean
  description: Select this if you want shift assignments to be automatically created indefinitely.
  default: true
- fieldname: create_shifts_after
  label: Create Shifts After
  fieldtype: Date
  description: New shift assignments will be created after this date.
  default: today
- fieldname: employee
  label: Employee
  fieldtype: Link
  options: Employee
  required: true
  in_list_view: true
- fieldname: employee_name
  label: Employee Name
  fieldtype: Text
  read_only: true
  fetch_from: employee.employee_name
- fieldname: company
  label: Company
  fieldtype: Link
  options: Company
  required: true
  in_list_view: true
  read_only: true
- fieldname: shift_status
  label: Shift Status
  fieldtype: Select
  options:
  - Active
  - Inactive
  default: Active
- fieldname: shift_schedule
  label: Shift Schedule
  fieldtype: Link
  options: Shift Schedule
  required: true
- fieldname: shift_location
  label: Shift Location
  fieldtype: Link
  options: Shift Location
title_field: employee_name
layout:
- section: Employee Details
  columns:
  - - employee
    - employee_name
  - - company
- section: Shift Details
  columns:
  - - shift_schedule
    - shift_location
    - shift_status
  - - enabled
    - create_shifts_after
