schema_version: 1
name: Subcontracting Order Service Item
label: Subcontracting Order Service Item
istable: true
fields:
- fieldname: item_code
  label: Item Code
  fieldtype: Link
  options: Item
  required: true
  in_list_view: true
- fieldname: item_name
  label: Item Name
  fieldtype: Text
  in_list_view: true
  fetch_from: item_code.item_name
- fieldname: qty
  label: Quantity
  fieldtype: Decimal
  decimals: 3
  required: true
  in_list_view: true
- fieldname: rate
  currency_from: parent_supplier_currency
  label: Rate
  fieldtype: Currency
  decimals: 2
  required: true
  in_list_view: true
- fieldname: amount
  currency_from: parent_supplier_currency
  label: Amount
  fieldtype: Currency
  decimals: 2
  required: true
  in_list_view: true
  read_only: true
- fieldname: base_rate
  currency_from: parent_company.default_currency
  label: Rate (Company Currency)
  fieldtype: Currency
  decimals: 2
  read_only: true
- fieldname: base_amount
  currency_from: parent_company.default_currency
  label: Amount (Company Currency)
  fieldtype: Currency
  decimals: 2
  read_only: true
- fieldname: fg_item
  label: Finished Good Item
  fieldtype: Link
  options: Item
  required: true
- fieldname: fg_item_qty
  label: Finished Good Item Quantity
  fieldtype: Decimal
  decimals: 3
  required: true
  default: "1.000"
- fieldname: purchase_order_item
  label: Purchase Order Item
  fieldtype: Text
  read_only: true
  hidden: true
- fieldname: material_request
  label: Material Request
  fieldtype: Link
  options: Material Request
  read_only: true
- fieldname: material_request_item
  label: Material Request Item
  fieldtype: Text
  read_only: true
