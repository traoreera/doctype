  in_list_view: true
- fieldname: service_item
  label: Service Item
  fieldtype: Link
  options: Item
  required: true
  in_list_view: true
- fieldname: service_item_qty
  label: Service Item Qty
  fieldtype: Number
  required: true
  default: 1.0
- fieldname: service_item_uom
  label: Service Item UOM
  fieldtype: Link
  options: UOM
  required: true
- fieldname: conversion_factor
