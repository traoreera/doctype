  - - customer_group
    - territory
- tab: Pricing
  section: Comptabilité et montants
  columns:
  - - selling_price_list
    - fallback_to_default_price_list
    - editable_price_list_rate
- tab: Pricing
  section: Comptabilité et montants
  columns:
  - - maintain_same_sales_rate
  - - maintain_same_rate_action
- tab: Pricing
  section: Comptabilité et montants
  columns:
  - - validate_selling_price
    - editable_bundle_item_rates
    - allow_negative_rates_for_items
- tab: Transaction
  section: Transaction Settings
  columns:
  - - so_required
    - dn_required
    - skip_delivery_note_for_service_items
    - sales_update_frequency
  - - allow_multiple_items
    - allow_against_multiple_purchase_orders
    - hide_tax_id
- tab: Transaction
  section: Comptabilité et montants
  columns:
  - - allow_sales_order_creation_for_expired_quotation
    - dont_reserve_sales_order_qty_on_sales_return
    - enable_cutoff_date_on_bulk_delivery_note_creation
    - set_zero_rate_for_expired_batch
- tab: Transaction
  section: Zero-Quantity Line Items
  columns:
  - - allow_zero_qty_in_quotation
  - - allow_zero_qty_in_sales_order
- tab: Transaction
  section: Blanket Orders
  columns:
  - - blanket_order_allowance
- tab: Transaction
  section: Proforma Invoice
  columns:
  - - enable_proforma_invoice
    - default_proforma_print_format
    - proforma_email_template
- tab: Advanced Features
  section: Comptabilité et montants
  columns:
  - - enable_tracking_sales_commissions
    - enable_discount_accounting
    - enable_utm
- tab: Advanced Features
  section: Experimental
  columns:
  - - use_legacy_js_reactivity
- tab: Subcontracting Inward
  section: Références
  columns:
  - - allow_delivery_of_overproduced_qty
  - - deliver_secondary_items
