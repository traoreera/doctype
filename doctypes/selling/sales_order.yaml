  - - incoterm
    - named_place
- tab: Général
  section: Comptabilité et montants
  columns:
  - - taxes
- tab: Général
  section: Comptabilité et montants
  columns:
  - - base_total_taxes_and_charges
  - - total_taxes_and_charges
