schema_version: 1
name: Sales Order
label: Sales Order
module: selling
naming:
  series: SO-{YYYY}-{#####}
submittable: true
icon: shopping-cart
fields:
- fieldname: naming_series
  label: Series
  fieldtype: Select
  options:
  - SAL-ORD-.YYYY.-
  required: true
- fieldname: customer
  label: Customer
  fieldtype: Link
  options: Customer
  required: true
- fieldname: customer_name
  label: Customer Name
  fieldtype: Text
  read_only: true
  fetch_from: customer.customer_name
- fieldname: order_type
  label: Order Type
  fieldtype: Select
  options:
  - Sales
  - Maintenance
  - Shopping Cart
  default: Sales
  required: true
- fieldname: company
  label: Company
  fieldtype: Link
  options: Company
  required: true
- fieldname: transaction_date
  label: Date
  fieldtype: Date
  required: true
  default: today
- fieldname: delivery_date
  label: Delivery Date
  fieldtype: Date
  in_list_view: true
- fieldname: po_no
  label: Customer's Purchase Order
  fieldtype: Text
- fieldname: po_date
  label: Customer's Purchase Order Date
  fieldtype: Date
- fieldname: tax_id
  label: Tax Id
  fieldtype: Text
  read_only: true
- fieldname: customer_address
  label: Customer Address
  fieldtype: Link
  options: Address
- fieldname: address_display
  label: Address
  fieldtype: TextEditor
  read_only: true
- fieldname: contact_person
  label: Contact Person
  fieldtype: Link
  options: Contact
- fieldname: contact_display
  label: Contact
  fieldtype: LongText
  read_only: true
- fieldname: contact_mobile
  label: Mobile No
  fieldtype: LongText
  read_only: true
- fieldname: contact_email
  label: Contact Email
  fieldtype: Text
  read_only: true
  hidden: true
- fieldname: company_address_display
  label: Company Address
  fieldtype: TextEditor
  read_only: true
- fieldname: company_address
  label: Company Address Name
  fieldtype: Link
  options: Address
- fieldname: shipping_address_name
  label: Shipping Address Name
  fieldtype: Link
  options: Address
- fieldname: shipping_address
  label: Shipping Address
  fieldtype: TextEditor
  read_only: true
- fieldname: shipping_contact_person
  label: Shipping Contact Person
  fieldtype: Link
  options: Contact
- fieldname: shipping_contact_display
  label: Shipping Contact
  fieldtype: LongText
  read_only: true
- fieldname: shipping_contact_mobile
  label: Shipping Contact Mobile No
  fieldtype: LongText
  read_only: true
- fieldname: shipping_contact_email
  label: Shipping Contact Email
  fieldtype: Text
  read_only: true
  hidden: true
- fieldname: customer_group
  label: Customer Group
  fieldtype: Link
  options: Customer Group
  hidden: true
- fieldname: territory
  label: Territory
  fieldtype: Link
  options: Territory
- fieldname: currency
  label: Currency
  fieldtype: Link
  options: Currency
  required: true
- fieldname: conversion_rate
  label: Exchange Rate
  fieldtype: Number
  required: true
  description: Rate at which customer's currency is converted to company's base currency
- fieldname: selling_price_list
  label: Price List
  fieldtype: Link
  options: Price List
  required: true
- fieldname: price_list_currency
  label: Price List Currency
  fieldtype: Link
  options: Currency
  required: true
  read_only: true
- fieldname: plc_conversion_rate
  label: Price List Exchange Rate
  fieldtype: Number
  required: true
  description: Rate at which Price list currency is converted to company's base currency
- fieldname: ignore_pricing_rule
  label: Ignore Pricing Rule
  fieldtype: Boolean
  default: false
- fieldname: set_warehouse
  label: Set Source Warehouse
  fieldtype: Link
  options: Warehouse
- fieldname: scan_barcode
  label: Scan Barcode
  fieldtype: Text
- fieldname: items
  label: Items
  fieldtype: Table
  options: Sales Order Item
- fieldname: pricing_rules
  label: Pricing Rule Detail
  fieldtype: Table
  options: Pricing Rule Detail
  read_only: true
- fieldname: total_qty
  label: Total Quantity
  fieldtype: Decimal
  decimals: 3
  read_only: true
  compute: sum(items.qty)
- fieldname: base_total
  label: Total (Company Currency)
  fieldtype: Currency
  decimals: 2
  read_only: true
- fieldname: base_net_total
  label: Net Total (Company Currency)
  fieldtype: Currency
  decimals: 2
  read_only: true
- fieldname: total
  label: Total
  fieldtype: Currency
  decimals: 2
  read_only: true
  compute: sum(items.amount)
- fieldname: net_total
  label: Net Total
  fieldtype: Currency
  decimals: 2
  read_only: true
  compute: sum(items.net_amount)
- fieldname: total_net_weight
  label: Total Net Weight
  fieldtype: Number
  read_only: true
- fieldname: tax_category
  label: Tax Category
  fieldtype: Link
  options: Tax Category
- fieldname: shipping_rule
  label: Shipping Rule
  fieldtype: Link
  options: Shipping Rule
- fieldname: taxes_and_charges
  label: Sales Taxes and Charges Template
  fieldtype: Link
  options: Sales Taxes and Charges Template
- fieldname: taxes
  label: Sales Taxes and Charges
  fieldtype: Table
  options: Sales Taxes and Charges
- fieldname: other_charges_calculation
  label: Taxes and Charges Calculation
  fieldtype: TextEditor
  read_only: true
- fieldname: base_total_taxes_and_charges
  label: Total Taxes and Charges (Company Currency)
  fieldtype: Currency
  decimals: 2
  read_only: true
- fieldname: total_taxes_and_charges
  label: Total Taxes and Charges
  fieldtype: Currency
  decimals: 2
  read_only: true
- fieldname: loyalty_points
  label: Loyalty Points
  fieldtype: Int
  read_only: true
  hidden: true
- fieldname: loyalty_amount
  label: Loyalty Amount
  fieldtype: Currency
  decimals: 2
  read_only: true
  hidden: true
- fieldname: coupon_code
  label: Coupon Code
  fieldtype: Link
  options: Coupon Code
- fieldname: apply_discount_on
  label: Apply Additional Discount On
  fieldtype: Select
  options:
  - Grand Total
  - Net Total
  default: Grand Total
- fieldname: base_discount_amount
  label: Additional Discount Amount
  fieldtype: Currency
  decimals: 2
  read_only: true
- fieldname: additional_discount_percentage
  label: Additional Discount Percentage
  fieldtype: Number
- fieldname: discount_amount
  label: Additional Discount Amount
  fieldtype: Currency
  decimals: 2
  description: Applying a Discount Amount? When this Sales Order is partially fulfilled through multiple Delivery
    Notes and Sales Invoices, the Discount Amount is allocated on a FIFO basis. The earlier transactions receive
    a larger share of the discount. To spread the discount proportionally across item prices, use Additional Discount
    Percentage instead.
- fieldname: base_grand_total
  label: Grand Total
  fieldtype: Currency
  decimals: 2
  read_only: true
- fieldname: base_rounding_adjustment
  label: Rounding Adjustment
  fieldtype: Currency
  decimals: 2
  read_only: true
- fieldname: base_rounded_total
  label: Rounded Total
  fieldtype: Currency
  decimals: 2
  read_only: true
- fieldname: base_in_words
  label: In Words
  fieldtype: Text
  read_only: true
  description: In Words will be visible once you save the Sales Order.
- fieldname: grand_total
  label: Grand Total
  fieldtype: Currency
  decimals: 2
  in_list_view: true
  read_only: true
  compute: total + total_taxes_and_charges
- fieldname: rounding_adjustment
  label: Rounding Adjustment
  fieldtype: Currency
  decimals: 2
  read_only: true
- fieldname: rounded_total
  label: Rounded Total
  fieldtype: Currency
  decimals: 2
  read_only: true
- fieldname: in_words
  label: In Words
  fieldtype: Text
  read_only: true
- fieldname: advance_paid
  label: Advance Paid
  fieldtype: Currency
  decimals: 2
  read_only: true
- fieldname: packed_items
  label: Packed Items
  fieldtype: Table
  options: Packed Item
- fieldname: payment_terms_template
  label: Payment Terms Template
  fieldtype: Link
  options: Payment Terms Template
- fieldname: payment_schedule
  label: Payment Schedule
  fieldtype: Table
  options: Payment Schedule
- fieldname: tc_name
  label: Terms
  fieldtype: Link
  options: Terms and Conditions
- fieldname: terms
  label: Terms and Conditions Details
  fieldtype: TextEditor
- fieldname: inter_company_order_reference
  label: Inter Company Order Reference
  fieldtype: Link
  options: Purchase Order
  read_only: true
- fieldname: project
  label: Project
  fieldtype: Link
  options: Project
- fieldname: party_account_currency
  label: Party Account Currency
  fieldtype: Link
  options: Currency
  read_only: true
  hidden: true
- fieldname: language
  label: Print Language
  fieldtype: Link
  options: Language
  read_only: true
- fieldname: letter_head
  label: Letter Head
  fieldtype: Link
  options: Letter Head
- fieldname: select_print_heading
  label: Print Heading
  fieldtype: Link
  options: Print Heading
- fieldname: group_same_items
  label: Group same items
  fieldtype: Boolean
  default: false
- fieldname: status
  label: Status
  fieldtype: Select
  options:
  - Draft
  - On Hold
  - To Pay
  - To Deliver and Bill
  - To Bill
  - To Deliver
  - Completed
  - Cancelled
  - Closed
  default: Draft
  required: true
  in_list_view: true
  read_only: true
- fieldname: delivery_status
  label: Delivery Status
  fieldtype: Select
  options:
  - Not Delivered
  - Fully Delivered
  - Partly Delivered
  - Closed
  - Not Applicable
  hidden: true
- fieldname: per_delivered
  label: '%  Delivered'
  fieldtype: Percent
  in_list_view: true
  read_only: true
  description: '% of materials delivered against this Sales Order'
- fieldname: per_billed
  label: '% Amount Billed'
  fieldtype: Percent
  in_list_view: true
  read_only: true
  description: '% of materials billed against this Sales Order'
- fieldname: billing_status
  label: Billing Status
  fieldtype: Select
  options:
  - Not Billed
  - Fully Billed
  - Partly Billed
  - Closed
  hidden: true
- fieldname: sales_partner
  label: Sales Partner
  fieldtype: Link
  options: Sales Partner
- fieldname: commission_rate
  label: Commission Rate
  fieldtype: Number
- fieldname: total_commission
  label: Total Commission
  fieldtype: Currency
  decimals: 2
- fieldname: sales_team
  label: Sales Team
  fieldtype: Table
  options: Sales Team
- fieldname: from_date
  label: From Date
  fieldtype: Date
- fieldname: to_date
  label: To Date
  fieldtype: Date
- fieldname: auto_repeat
  label: Auto Repeat
  fieldtype: Link
  options: Auto Repeat
- fieldname: contact_phone
  label: Phone
  fieldtype: Text
  read_only: true
- fieldname: is_internal_customer
  label: Is Internal Customer
  fieldtype: Boolean
  read_only: true
- fieldname: represents_company
  label: Represents Company
  fieldtype: Link
  options: Company
  read_only: true
- fieldname: disable_rounded_total
  label: Disable Rounded Total
  fieldtype: Boolean
  default: false
- fieldname: dispatch_address_name
  label: Dispatch Address Name
  fieldtype: Link
  options: Address
- fieldname: dispatch_address
  label: Dispatch Address
  fieldtype: TextEditor
  read_only: true
- fieldname: amount_eligible_for_commission
  label: Amount Eligible for Commission
  fieldtype: Currency
  decimals: 2
  read_only: true
- fieldname: per_picked
  label: '% Picked'
  fieldtype: Percent
  read_only: true
- fieldname: cost_center
  label: Cost Center
  fieldtype: Link
  options: Cost Center
- fieldname: incoterm
  label: Incoterm
  fieldtype: Link
  options: Incoterm
- fieldname: named_place
  label: Named Place
  fieldtype: Text
- fieldname: reserve_stock
  label: Reserve Stock
  fieldtype: Boolean
  description: If checked, Stock will be reserved on <b>Submit</b>
  default: false
- fieldname: advance_payment_status
  label: Advance Payment Status
  fieldtype: Select
  options:
  - Not Requested
  - Requested
  - Partially Paid
  - Fully Paid
  hidden: true
- fieldname: utm_medium
  label: Medium
  fieldtype: Link
  options: UTM Medium
- fieldname: utm_content
  label: Content
  fieldtype: Text
- fieldname: utm_source
  label: Source
  fieldtype: Link
  options: UTM Source
- fieldname: utm_campaign
  label: Campaign
  fieldtype: Link
  options: UTM Campaign
- fieldname: company_contact_person
  label: Company Contact Person
  fieldtype: Link
  options: Contact
- fieldname: skip_delivery_note
  label: Skip Delivery Note
  fieldtype: Boolean
  read_only: true
  hidden: true
- fieldname: has_unit_price_items
  label: Has Unit Price Items
  fieldtype: Boolean
  hidden: true
  default: false
- fieldname: last_scanned_warehouse
  label: Last Scanned Warehouse
  fieldtype: Text
- fieldname: is_subcontracted
  label: Is Subcontracted
  fieldtype: Boolean
  default: false
- fieldname: item_wise_tax_details
  label: Item Wise Tax Details
  fieldtype: Table
  options: Item Wise Tax Detail
  hidden: true
- fieldname: transaction_time
  label: Time
  fieldtype: Time
- fieldname: ignore_default_payment_terms_template
  label: Ignore Default Payment Terms Template
  fieldtype: Boolean
  read_only: true
  hidden: true
- fieldname: title
  label: Title
  fieldtype: Text
title_field: title
layout:
- tab: Général
  section: Comptabilité et montants
  columns:
  - - company
    - naming_series
    - customer
    - customer_name
  - - order_type
    - transaction_date
    - transaction_time
    - delivery_date
  - - tax_id
    - is_subcontracted
- tab: Général
  section: Accounting Dimensions
  columns:
  - - cost_center
  - - project
- tab: Général
  section: Currency and Price List
  columns:
  - - currency
    - conversion_rate
  - - selling_price_list
    - price_list_currency
    - plc_conversion_rate
    - ignore_pricing_rule
- tab: Général
  section: Items
  columns:
  - - scan_barcode
    - last_scanned_warehouse
  - - set_warehouse
